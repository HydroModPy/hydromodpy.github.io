00" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="133" x="169" y="700.5122">savefig(output_path)</text><path d="M80.5,720.5781 L150.5,720.5781 L150.5,727.5781 L140.5,737.5781 L80.5,737.5781 L80.5,720.5781 " fill="#EEEEEE" style="stroke: #000000; stroke-width: 1.0;"/><rect fill="none" height="46.2656" style="stroke: #000000; stroke-width: 2.0;" width="764" x="80.5" y="720.5781"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="25" x="95.5" y="733.645">opt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="118" x="165.5" y="732.7886">[interactive mode]</text><polygon fill="#A80036" points="780.5,754.8438,790.5,758.8438,780.5,762.8438,784.5,758.8438" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="162" x2="786.5" y1="758.8438" y2="758.8438"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="42" x="169" y="753.7778">show()</text><polygon fill="#A80036" points="38,790.9766,28,794.9766,38,798.9766,34,794.9766" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="32" x2="161" y1="794.9766" y2="794.9766"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="111" x="44" y="789.9106">saved figure path</text><!--MD5=[bfe19d7f91d6e02dcefebb274ff69457]
@startuml
title Field - Demo Sequence (Square Case)

actor User
participant "run_field_demo.py" as Runner
participant "FieldParam" as Param
participant "FieldMeshSquare" as MeshFactory
participant "FieldSquare" as SpatialField
participant "Matplotlib" as Plot

User -> Runner: execute script
Runner -> Runner: parse args\nresolve paths

Runner -> Param: from_toml(field_param_config)
Param - -> Runner: field_param

Runner -> MeshFactory: from_toml(mesh_config)
MeshFactory - -> Runner: mesh

alt field_param.is_heterogeneous
  Runner -> SpatialField: from_toml(field_spatial_config)
  SpatialField - -> Runner: field
  Runner -> Runner: validate field_spatial_id == field.identifier
  Runner -> SpatialField: on_mesh(mesh)
  SpatialField - -> Runner: field_discretization
  Runner -> Param: to_mesh_field(field_discretization)
  Param - -> Runner: values_mesh
else homogeneous
  Runner -> Param: to_mesh_field(mesh=mesh)
  Param - -> Runner: values_mesh
end

Runner -> Plot: create figure panels
Runner -> Plot: savefig(output_path)
opt interactive mode
  Runner -> Plot: show()
end

Runner - -> User: saved figure path
@enduml

