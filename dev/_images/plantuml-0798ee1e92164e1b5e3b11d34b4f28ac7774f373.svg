ne style="stroke: #A80036; stroke-width: 1.5;" x1="402.25" x2="402.25" y1="877.4023" y2="979.7734"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="402.25" x2="304.75" y1="979.7734" y2="979.7734"/><polygon fill="#A80036" points="314.75,975.7734,304.75,979.7734,314.75,983.7734,310.75,979.7734" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="292.75" x2="292.75" y1="947.7734" y2="967.7734"/><polygon fill="#A80036" points="288.75,957.7734,292.75,967.7734,296.75,957.7734,292.75,961.7734" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="292.75" x2="292.75" y1="845.4023" y2="865.4023"/><polygon fill="#A80036" points="288.75,855.4023,292.75,865.4023,296.75,855.4023,292.75,859.4023" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="292.75" x2="292.75" y1="991.7734" y2="1011.7734"/><polygon fill="#A80036" points="288.75,1001.7734,292.75,1011.7734,296.75,1001.7734,292.75,1005.7734" style="stroke: #A80036; stroke-width: 1.0;"/><!--MD5=[9441d8363ce9433395e6663a76834540]
@startuml
title Field - Demo Activity Flow (Square Case)

start

:Parse CLI arguments;
:Resolve config and output paths;
:Load field parameters\nfield_param_from_toml(...);
:Load mesh\nFieldMeshSquare.from_toml(...);

if (field_param.is_heterogeneous?) then (yes)
  :Load spatial field\nFieldSquare.from_toml(...);
  if (field_param.field_spatial_id == field.id?) then (yes)
  else (no)
    :Raise ValueError;
    stop
  endif
  :Discretize field on mesh\nfield.on_mesh(mesh);
  :Compute field values on mesh\nfield_param.to_mesh_field(discretization);
else (no)
  :Broadcast homogeneous value\nfield_param.to_mesh_field(mesh=mesh);
endif

:Create 3-panel figure;
:Save figure in outputs directory;

if (- -no-show-plot?) then (yes)
else (no)
  :Display figure with plt.show();
endif

stop
@enduml

