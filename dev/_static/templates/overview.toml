# ======================================================================
# HydroModPy Configuration
# Profile: user | Modules: overview
# Auto-generated from Pydantic models.
# Edit values below. Comments describe each parameter.
# ======================================================================


# ----------------------------------------------------------------------
# Overview report settings (watershed identity card).
# ----------------------------------------------------------------------

[overview]
# Name of the watershed shown in the titles of the report.
# Unset, the catchment name of the workspace is used.
# Type: string | Default: ""
name = ""

# Start of the overview window (ISO date, e.g.
# '2019-01-01').
# Overview mode has no [simulation.time], so this is the date declaration every [data.<type>] section without a window of its own inherits.
# Must be declared together with date_end.
# Type: string (optional) | Optional | Examples: "2019-01-01"
# date_start = ""

# End of the overview window (ISO date, e.g.
# '2025-12-31').
# Overview mode has no [simulation.time], so this is the date declaration every [data.<type>] section without a window of its own inherits.
# Must be declared together with date_start.
# Type: string (optional) | Optional | Examples: "2025-12-31"
# date_end = ""

# Label used for the regional location figure.
# Type: string (optional) | Optional
# regional_context_label = ""


# Panel toggles.

[overview.panels]
# Draw the map of the DEM elevations with the watershed, streams and stations.
# Type: bool | Default: true
map_dem = true

# Draw the map of the geology units over the watershed.
# It needs loaded geology.
# Type: bool | Default: true
map_geology = true

# Draw the map of the mapped BD Topage stream network over the watershed.
# Type: bool | Default: true
map_hydrography = true

# Draw the identity card: name, area, period, number of stream reaches and stations of each kind.
# Type: bool | Default: true
stats_card = true

# Draw the observed discharge series of the hydrometric stations, in m3/s.
# Type: bool | Default: true
timeseries_discharge = true

# Draw the observed groundwater-level series of the piezometers, in metres.
# Type: bool | Default: true
timeseries_piezometry = true

# Draw the monthly means of precipitation and ETP as bars.
# Type: bool | Default: true
climatic_summary = true

# Draw the flow states observed by the ONDE network at its stations.
# Type: bool | Default: true
timeseries_intermittency = true

# Draw the water-quality series, one panel per measured parameter.
# Type: bool | Default: true
timeseries_water_quality = true

# Draw the table of every station: type, id, coordinates and period.
# Type: bool | Default: true
station_inventory = true

