# ----------------------------------------------------------------------
# Top-level hydrometry configuration.
# ----------------------------------------------------------------------

[hydrometry]
# Start of the data window (ISO date, e.g.
# '2019-01-01').
# Optional: when neither bound is declared, the loader inherits [simulation.time].start_datetime, or [overview].date_start in overview mode.
# Declare it only to fetch a window WIDER than the simulation, typically a cache shared by several runs.
# Must be declared together with date_end.
# Type: string (optional) | Optional | Examples: "2019-01-01"
# date_start = ""

# End of the data window (ISO date, e.g.
# '2025-12-31').
# Optional: when neither bound is declared, the loader inherits [simulation.time].end_datetime, or [overview].date_end in overview mode.
# Declare it only to fetch a window WIDER than the simulation, typically a cache shared by several runs.
# Must be declared together with date_start.
# Type: string (optional) | Optional | Examples: "2025-12-31"
# date_end = ""


# At least one data source.
[[hydrometry.sources]]
# Explicit station identifiers to select, whether stations are read from a custom source or fetched from an API source such as Hub'Eau.
# Type: list (optional) | Optional
station_ids = []

# Download this source again instead of reading the cache.
# Type: bool | Default: false
force_refresh = false

# Optional SHP/GPKG/GeoJSON/TIF mask to spatially filter stations or clip gridded sources.
# Type: path (optional) | Optional
mask_path = ""

# Optional source unit for custom gridded .nc/.tif inputs.
# When omitted for NetCDF, units are inferred from variable metadata.
# Type: string (optional) | Optional
source_unit = ""

# Name of the column that holds the dates in your chronicle CSV files.
# Type: string | Default: "datetime"
col_datetime = "datetime"

# Name of the column that holds the values in your chronicle CSV files.
# Type: string | Default: "value"
col_value = "value"

# Data provider: 'custom' for user files, 'hubeau' for Hub'Eau API.
# Type: Literal['custom', 'hubeau'] | one of: "custom", "hubeau" | Default: "hubeau"
source = "hubeau"

# Directory containing location file and chronicle CSVs.
# Type: path (optional) | Optional
path = ""

# Hub'Eau variable code (e.g.
# 'QmnJ', 'QmM', 'HmnJ').
# Type: string (optional) | Default: "QmnJ"
product = "QmnJ"

# Maximum number of Hub'Eau stations to KEEP.
# Stations that return no observation in the window do not count against it, so a preview run over a larger territory gets this many stations carrying data, not this many tried.
# Type: int (optional) | > 0 | Optional
max_stations = 1

