# The set of defaults the file is read with.
# A key the file does not write takes its default in this edition, so a later version never moves a number of a file that did not ask.
# config.resolved.toml writes it.
# Type: string | Default: "2.0" | Examples: "2.0"
edition = "2.0"

# ----------------------------------------------------------------------
# Display behavior resolved from the ``[display]`` TOML section.
# ----------------------------------------------------------------------

[display]
# Master switch.
# When False, no figure is rendered or saved.
# Type: bool | Default: true
enabled = true

# Named theme applied before rendering any figure: default, print or dark.
# Type: string | Default: "default"
theme = "default"

# Your own presets, one ``[display.presets.NAME]`` table each, written like a figure.
# A figure then names one with ``preset = NAME``.
# A name of a shipped preset is refused.
# Type: dict[str, FigureRequest] | Default: {}

# Behaviour when a figure that IS applicable fails while rendering.
# 'warn' logs and continues (default, keeps a long run alive); 'raise' propagates, which is what example and CI configs want so a broken figure cannot pass unnoticed.
# Type: Literal['warn', 'raise'] | one of: "warn", "raise" | Default: "warn"
on_error = "warn"


# Example entry, one [display.presets.<id>] table per entry.
# [display.presets.<id>]
# Frame of the panel.
# Unset, the natural frame of the variable.
# Type: string (optional) | Optional
# type = ""
# Variable name or list.
# 'budget' is the budget terms the run kept.
# In a table panel, 'table.column' names.
# Type: Annotated (optional) | Optional
# variable = ""
# A date (YYYY-MM-DD), 'first', 'last', a period index, or a list of them.
# A date picks the period (start, end] that holds it.
# On a series, two values keep the periods whose start lies between them.
# Type: UnionType[str, int, list, NoneType] | Optional
# time = ""
# Layer index from 0 at the top, or 'sum' over the layers.
# Type: UnionType[int, str, NoneType] | Optional
