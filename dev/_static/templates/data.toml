[data]
# Ordered list of data-manager types explicitly requested in [data].
# The launcher may append inferred types deduced from other sections (for example domain.zone_ids, flow.active_bc).
# Allowed values: 'crossings', 'dem', 'etp', 'geology', 'humidity', 'hydrography', 'hydrometry', 'intermittency', 'lake_abacus', 'lake_bathymetry', 'lake_geometry', 'lake_inflow', 'lake_levels', 'lake_outflow', 'lake_withdrawal', 'oceanic', 'piezometry', 'precipitation', 'radiation', 'recharge', 'runoff', 'soil_capacity', 'soil_moisture', 'substratum', 'temperature', 'water_quality', 'wind'.
# Type: list[str] | REQUIRED
types = []

# Policy applied when the planner infers types not explicitly listed in data.types.
# 'warn': keep inferred types and continue even if data.<type> is missing.
# 'strict': raise when an inferred type has no explicit data.<type> section (except geology, which can use its default typed config).
# Type: Literal['warn', 'strict'] | one of: "warn", "strict" | Default: "warn"
inference_mode = "warn"


# Crossings configuration (roads, railways, bridges, weirs and dams laid across the channels, read by [geographic.crossings]).

# [data.crossings]
# SHP/GPKG/GeoJSON/TIF whose bounds are the box the API sources are asked over.
# A project run has it filled in from the delineated watershed; a standalone call names it.
# Type: path (optional) | Optional
# mask_path = ""


# At least one crossings data source.
# [[data.crossings.sources]]
# Discriminator tag selecting the 'custom' crossings provider.
# Type: Literal['custom'] | one of: "custom" | Default: "custom"
# source = "custom"

# Path to a vector file (SHP, GPKG, GeoJSON) or to a folder holding one.
# It must carry a 'kind' column.
# Type: path | REQUIRED
# path = ""

# Fallback CRS used only when the file carries none of its own.
# Defaults to RGF93/Lambert-93 (EPSG:2154).
# Type: string | Default: "EPSG:2154"
# default_crs = "EPSG:2154"


# DEM configuration used when 'dem' is listed in data.types.

# At least one DEM data source.
# [[data.dem.sources]]
# Vector polygon file (shp, gpkg or GeoJSON) whose extent this source is requested over.
# A project run fills it with the delineated watershed.
# Type: path (optional) | Optional
# mask_path = ""

# Download this source again instead of reading the cache.
# Type: bool | Default: false
# force_refresh = false

# Discriminator tag selecting the 'custom' DEM provider.
# Type: Literal['custom'] | one of: "custom" | Default: "custom"
# source = "custom"

# Path to custom DEM file or directory (TIF, ASC, NC).
# Type: path | REQUIRED | Examples: "dem.tif"
# path = ""


# Geology configuration used when 'geology' is listed in data.types.

# [data.geology]
# Identifier of the geology spatial field.
# Type: string | Default: "field_geology"
# id = "field_geology"


# At least one geology data source.
# Defaults to BRGM 1:1M.
# [[data.geology.sources]]
# Vector polygon file (shp, gpkg or GeoJSON) whose extent this source is requested over.
