# ======================================================================
# HydroModPy Configuration
# Profile: user | Modules: edition, sites
# Auto-generated from Pydantic models.
# Edit values below. Comments describe each parameter.
# ======================================================================


# ----------------------------------------------------------------------
# Root-level workflow selector.
# ----------------------------------------------------------------------

# The set of defaults the file is read with.
# A key the file does not write takes its default in this edition, so a later version never moves a number of a file that did not ask.
# config.resolved.toml writes it.
# Type: string | Default: "2.0" | Examples: "2.0"
edition = "2.0"

# ----------------------------------------------------------------------
# The catchments of a project and the recipes run on each of them.
# ----------------------------------------------------------------------

[sites]
# Site table, one row per catchment: CSV, Parquet or GeoPackage, relative to the project root.
# Its columns are free and reach the config through [sites.bind].
# Unset, the plan reads data/sites/catalog.csv of the workspace, whose columns are fixed and need no bind.
# Type: path (optional) | Optional | Examples: "sites.csv"
# table = ""

# Recipe table, one row per recipe: a CSV with a mandatory 'recipe' column; its other columns are bound by [sites.bind] like the site table.
# A column present in both tables is refused.
# Type: path (optional) | Optional | Examples: "recipes.csv"
# recipes_table = ""

# Boolean column of the site table; unset, every row is a site of the plan.
# Type: string (optional) | Optional | Examples: "enabled"
# enabled = ""

# Site names the plan keeps; empty, every site.
# Type: list[str] | Default: []
include = []

# Site names the plan leaves out.
# Type: list[str] | Default: []
exclude = []

# Folder of per-site overlays, relative to the project root: <folder>/<site>.toml is applied to every case of that site when it exists.
# Type: path (optional) | Optional | Examples: "site_overrides/"
# overrides = ""

# Recipes run on every site, by name: a TOML file, or an inline table { file = "...", set = { "<dotted.key>" = value } }.
# The case of a site and a recipe is named <site>-<recipe>.
# A name is letters, digits and underscores.
# Unset, the file that declares [sites] is the only recipe.
# Type: dict[str, pathlib._local.Path | hydromodpy.config.sites.RecipeSpec] | Default: {} | Examples: {base = "project.toml", calibration = "calibration.toml"}

# Config keys filled from table columns: a quoted dotted path, the grammar of hmp run --set without index, mapped to a column, or to a list of columns for a list key.
# The cell is read by the type of the target field; an empty cell leaves the key unbound.
# Type: dict[str, str | list[str]] | Default: {} | Examples: {"geographic.catchment.x_outlet" = "x_outlet"}
# bind: entries go under [sites.bind.<id>]


# Example entry, one [sites.recipes.<id>] table per entry.
# [sites.recipes.<id>]
# TOML file the recipe starts from, relative to the project root.
# The resolved file is the case before the keys of 'set' are applied.
# Type: path | REQUIRED | Examples: "project.toml"
# file = ""
# Keys this recipe writes on top of its file, as quoted dotted paths ("flow.param.K.field.value" = 2e-5), the grammar of hmp run --set, without index.
# They are the recipe's own keys: they win over the site table and the site overlays.
# Type: dict[str, Any] | Default: {} | Examples: {"flow.param.K.field.value" = 2e-05}
# set = {}


# Experiment plan: points drawn in a box of parameters, each one a recipe of the base recipe.
# Unset, the recipes are the ones written.

# [sites.design]
# Design that places the points in the box of the parameters.
# sobol: scrambled Sobol sequence, nested: doubling n keeps the first points; lhs: Latin hypercube, one point per stratum, grown by independent lots; grid: regular grid, its size is the product of points_per_dim.
# Each point becomes a recipe: p0001, p0002 for sobol and grid, b1p0001 for the first point of the first lot of lhs.
# Type: string | Default: "sobol" | Examples: "sobol"
# method = "sobol"

# Number of points.
# Required for sobol and lhs, refused for grid whose size is the product of options.points_per_dim.
# For lhs a list gives the size of each lot: [60, 60] adds a second lot of 60 points to a first one already run, and the first lot does not move.
# A sobol size that is not a power of two warns, its balance holds for powers of two.
# Type: UnionType[int, list, NoneType] | Optional | Examples: 64, [60, 60]
# n = 0

# Seed of the draw, required for sobol and lhs.
# Without it every expansion would draw other points, give other solution keys to the same case names and run everything again.
# Type: int (optional) | >= 0 | Optional | Examples: 1
# seed = 0

# Recipe of [sites.recipes] that the points replace, and whose file and set they start from.
# Required if the project declares several recipes.
# The other recipes run once per site as before.
# Type: string (optional) | Optional | Examples: "base"
# recipe = ""

# Options of the method: optimization (random-cd or lloyd) for lhs, points_per_dim for grid.
# The number of points is n, never an option.
# Type: dict[str, Any] | Default: {} | Examples: {optimization = "random-cd"}
# options: entries go under [sites.design.options.<id>]

# Parameters that move, by name.
# The name is the column of cases.csv.
# Each is a calibration parameter: path, bounds and sampling are written, and the case gets the drawn value as if the recipe table had written it.
# Type: dict[str, CalibParameterDecl] | Default: {}


# Example entry, one [sites.design.parameters.<id>] table per entry.
# [sites.design.parameters.<id>]
# [low, high] physical bounds, in 'units' when the file writes it, else in the unit the target declares.
# Falls back to what the field annotates when the file omits it, which most fields deliberately leave unset because a range belongs to the site.
# Type: list (optional) | Optional
# bounds = []
# Space the search walks the parameter in.
# 'log' for strictly-positive quantities spanning orders of magnitude.
# Unset, the target's own field decides: a hydraulic conductivity declares 'log' where it is defined, so a file states this only to depart from it.
# Type: Literal['identity', 'log', 'logit'] | one of: "identity", "log", "logit" | Default: "identity"
# search_space = "identity"
# Distribution, between the bounds, that starting points, random draws and Bayesian samplers take values from.
# Type: Literal['uniform', 'log_uniform', 'normal'] | one of: "uniform", "log_uniform", "normal" | Default: "uniform"
# sampling = "uniform"
# Dotted TOML path of the value to move, such as 'flow.param.K.field.value'.
# Optional, and the way out rather than the way in: when omitted, the section name is resolved against the project catalogue ('hmp config targets' lists it).
# Write one to reach a value the catalogue does not carry, or to settle a name two targets answer to.
# A path written here wins without a lookup.
# When the catalogue carries it, the parameter inherits the field's space and draw like a named one; when it does not, nothing is inherited and the sample is written as it is drawn.
# Type: string (optional) | Optional
# path = ""
# Readable alias for 'path'.
# Setting both is refused.
# Type: string (optional) | Optional
# target = ""
# 'replace' writes the sampled value as-is; 'scale' multiplies the base TOML value at the target path by the sample.
# Type: Literal['replace', 'scale'] | one of: "replace", "scale" | Default: "replace"
# mode = "replace"
# Unit the bounds are written in, such as 'm/s'.
# For a parameter the catalogue resolves, bounds in another unit of the same quantity are converted when the file loads into the unit the target is read in, and the search draws, writes and reports its samples in that unit ('hmp config targets' lists it).
# A unit of another quantity is refused.
# Unset, the unit of the target applies.
# With mode = 'scale' the bounds are factors without a unit, and writing one is refused.
# For a path outside the catalogue it is the unit the bounds are checked against the physical range in.
# Type: string (optional) | Optional | Examples: "m/s"
# units = ""


# How the cases run side by side.

[sites.run]
# Total budget of solves that run side by side.
# A case whose [calibration] parallel is 5 takes 5 of it.
# The default is 8 because the throughput levelled off from 8 runs side by side on 22 cores, each run holding up to 1.2 GiB.
# Above 16 the launcher refuses without --force (16 runs held 14 GiB), and above 8 for a campaign that holds a calibration.
# Type: int | >= 1 | Default: 8 | Examples: 8
parallel = 8

# What a failed case does to the launch.
# Type: Literal['warn', 'raise'] | one of: "warn", "raise" | Default: "warn"
on_error = "warn"


# What summary/ tabulates and draws.

[sites.summary]
# Metrics of each case put in the summary tables, scored by the metric rule.
# Type: list[str] | Default: ["nse"] | Examples: ["nse", "kge"]
metrics = ["nse"]

# Metric that ranks the cases of a site to pick its best one, by the direction of the metric.
# The nse is always a column of the tables; any other one must be in metrics.
# The order of metrics does not choose it.
# Type: string | Default: "nse" | Examples: "kge"
rank_by = "nse"

# Parameters of each case put in the summary tables, calibrated or set.
# Type: list[str] | Default: [] | Examples: ["K", "Sy"]
parameters = []

# Cohort figures drawn under summary/figures/<figure>_<variable>.png: map, distribution.
# Type: list[str] | Default: [] | Examples: ["map", "distribution"]
figures = []

# Metric or parameter, or a list of them, the cohort figures map and distribute.
# Type: list[str] | Default: [] | Examples: ["K", "nse"]
variable = []

# Which case of a site the by-site table keeps as its best.
# Type: Literal['calibrated', 'any'] | one of: "calibrated", "any" | Default: "calibrated"
best = "calibrated"

# Extra columns read from the manifest.json of each run, as dotted paths without index (checks.budget_pct, metrics.nse).
# Type: list[str] | Default: [] | Examples: ["checks.budget_pct", "checks.converged"]
columns = []


# Windows the runs are scored on again, with the metrics above, into summary/scores.parquet.
# One [[sites.summary.window]] block each.
# Example entry, one [[sites.summary.window]] block per entry.
# [[sites.summary.window]]
# Name of the window, the window_name column of summary/scores.parquet.
# Type: string | REQUIRED | Examples: "dry-summers"
# name = ""

# First day of the window, an ISO date.
# Unset, the start of each run.
# Type: string (optional) | Optional | Examples: "2016-01-01"
# start = ""

# Last day of the window, an ISO date.
# Unset, the end of each run.
# Type: string (optional) | Optional | Examples: "2018-12-31"
# end = ""

# Calendar months kept, 1 to 12.
# Unset, every month.
# Type: list (optional) | Optional | Examples: [6, 7, 8, 9]
# months = []


# Exports of the project, one [[sites.export]] block each, under summary/exports/.
# Example entry, one [[sites.export]] block per entry.
# [[sites.export]]
# Summary table to export.
# Write table or runs, not both.
# Type: Literal (optional) | Optional
# table = "by_site"

# Runs whose variables are exported: the best case of each site.
# Type: Literal (optional) | Optional
# runs = "best"

# Variable, or a list of them, exported from each run, with runs = 'best'.
# Type: list[str] | Default: [] | Examples: ["discharge"]
# variable = []

# File format of the export, csv unless another is named.
# Type: string | Default: "csv" | Examples: "csv"
# format = "csv"

# For a table, the file name under summary/exports/ (unset: <table>.<format>); for runs = 'best', the folder of the series (unset: best).
# Type: string (optional) | Optional
# file = ""

