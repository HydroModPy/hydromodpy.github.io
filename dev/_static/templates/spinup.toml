[spinup]
# Maximum spin-up cycles before the loop stops without converging.
# Type: int | >= 1 | Default: 10
max_cycles = 10

# Head convergence tolerance [m].
# The loop converges when the largest absolute head change between two cycles (L-inf over active cells) is below this.
# Type: float | > 0.0 | Default: 0.01
tol_head = 0.01

# Lake-stage convergence tolerance [m].
# The loop converges when the largest absolute stage change between two cycles, over every lake, is below this.
# A model without a lake does not read it.
# Type: float | > 0.0 | Default: 0.01
tol_stage = 0.01

# Cycle window start (ISO datetime, e.g.
# '2019-01-01').
# The representative forcing period each cycle repeats.
# None reuses [simulation.time].
