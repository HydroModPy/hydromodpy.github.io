# ----------------------------------------------------------------------
# Configuration block defining the active groundwater solver engine.
# ----------------------------------------------------------------------

[solver]
# Dimensionless.
# Remove the drain from every cell sitting in a closed depression of the model top, by setting its DRN conductance to zero.
# A closed depression has no outlet, so water reaching it ponds instead of seeping into a stream, and a drain there invents a discharge point.
# The depressions are measured on the solver mesh, by a priority flood seeded on every cell water can leave the domain through; both MODFLOW backends read the same mask.
# This does NOT move the topography: no elevation is raised, no DEM is rewritten, and every other package sees the surface it would have seen.
# Refused when the mask cannot be built.
# The depressions are counted on the four shared faces MODFLOW connects, not on the eight neighbours a raster fill uses: measured on the Nancon, 4.56 per cent of the mesh against 2.12 per cent, a factor of two that is the neighbourhood and nothing else.
# NOT SANCTIONED BY ANY SOURCE: no manual, no USGS document and no guideline removes a discharge boundary where a pit is detected, and measured here it degrades both scores.
# The remedy the USGS does document for the same question is solver.drain_band_depth_m, which gives every cell a discharge band instead of taking the drain away.
# Default false, which drains every cell as before.
# Type: bool | Default: false | Examples: false, true
sink_fill = false

# Metres.
# Depth D of the sub-cell discharge band every drain cell gets instead of a single elevation: the drain sits at top - D/2 and its conductance is multiplied by top_layer_thickness / D.
# The multiplier is the thickness and not the cell area because the conductance it scales is already Kv*A/b, so scaling by b/D gives Kv*A/D, which is CDRN exactly; scaling by A/D would give an m3/s where a conductance is m2/s, too high by A/b.
# The cell therefore starts discharging before the head reaches its mean elevation, and discharges harder the higher the head climbs into the band.
# This answers the one question the USGS documents about a model top, that the land inside a cell is not flat: UZF1 exposes the same depth as SURFDEP, 'the average undulation depth within a finite-difference cell', and MODFLOW 6 carries it into DRN as DDRN, with HDRN = land surface - DDRN/2 and CDRN = Kv*A/DDRN.
# MODFLOW 6 solves its DDRN band with a smooth (linear then cubic) curve; the option here is the piecewise equivalent of the same idea, applied identically by both MODFLOW backends, so a later switch to the native smooth form is a documented refinement and not a surprise.
# It does NOT move the topography: no elevation is raised, no DEM is rewritten, and every other package sees the surface it would have seen.
# The seepage criterion is the one reader that cannot: a banded cell discharges at top - D/2 and never climbs back to top, so the mask follows the band and the run persists D in its store for every figure drawn afterwards.
# It classifies no cell: every drain cell gets the same band, so nothing has to be sorted into artefact and real.
# Pick D the way Feinstein et al.
# 2020 (Groundwater 58:524-534, doi:10.1111/gwat.12931) do, from the standard deviation of the fine land-surface elevations inside a cell; they obtain 0.61 m.
# Mutually exclusive with solver.sink_fill, which answers the same question by removing drains instead.
# Default 0.0: one elevation per drain, unchanged from every earlier run.
# Type: float | Default: 0.0 | Examples: 0.0, 0.5
drain_band_depth_m = 0.0


# Active flow backend selector (discriminated union).

[solver.backend]
# Flow solver of the run: MODFLOW 6, MODFLOW-NWT, Boussinesq or a plugin.
# Type: Literal['modflow6'] | one of: "modflow6" | Default: "modflow6"
backend = "modflow6"

