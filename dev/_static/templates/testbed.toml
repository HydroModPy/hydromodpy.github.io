# ======================================================================
# HydroModPy Configuration
# Profile: user | Modules: testbed
# Auto-generated from Pydantic models.
# Edit values below. Comments describe each parameter.
# ======================================================================


# ----------------------------------------------------------------------
# Validated configuration for one method testbed.
# ----------------------------------------------------------------------

[testbed]
# Stable testbed identifier.
# Left out, the TOML file name without its extension is used.
# Type: string | REQUIRED | Examples: "k_sensitivity"
id = ""

# Testbed profile: 'generic' runs the declared cases, 'regional_lab' runs them over every site of a site catalog.
# Type: string | Default: "generic"
profile = "generic"

# What the cases vary: 'flow', 'mesh' or 'transport'.
# Type: string | Default: "mesh"
subject = "mesh"

# Stated purpose of the testbed, written in its report (robustness, sensitivity...).
# Type: string | Default: "robustness"
purpose = "robustness"

# Directory where testbed artifacts are written, relative to the TOML file.
# Left out, testbed/<id> next to the TOML file.
# Type: path | REQUIRED | Examples: "testbed_output"
output_root = ""

# When false, child configs are materialized but not executed.
# Type: bool | Default: true
execute = true

# When false, the first failure aborts the testbed.
# Type: bool | Default: true
continue_on_error = true

# Child workflow TOML every case starts from, relative to this file.
# Required when subject is flow or transport.
# Type: path (optional) | Optional
# base_config_path = ""

# Explicit executable cases declared in the TOML.
# Type: tuple[TestbedCaseConfig, Ellipsis] | Default: []
case = []

# Case-generation rules applied to catalog rows.
# Type: tuple[TestbedCatalogCaseConfig, Ellipsis] | Default: []
case_from_catalog = []

# Metrics extracted from each child-runner summary.
# Type: tuple[TestbedMetricConfig, Ellipsis] | Default: []
metrics = []


# Child-runner selection for every case.

[testbed.runner]
# Workflow every case runs: 'simulation', 'comparison' or 'calibration'.
# Which ones a subject accepts: mesh takes simulation; transport takes simulation and comparison; flow takes all three.
# Type: string | Default: "simulation"
type = "simulation"

# Disable interactive display in child runners.
# Type: bool | Default: true
no_display = true


# Optional catalog source used to expand cases from rows.

# [testbed.catalog]
# Resolved path to the case catalog (CSV or JSONL).
# Type: path | REQUIRED | Examples: "cases.csv"
# path = ""

# Catalog format.
# 'auto' infers from the file suffix.
# Type: string | Default: "auto"
# format = "auto"

# Name of the catalog column that holds the case names.
# Type: string | Default: "case_id"
# id_field = "case_id"

# Column carrying a human-readable case label.
# Type: string (optional) | Default: "case_label"
# label_field = "case_label"

# Column carrying the optional axis tag.
# Type: string (optional) | Default: "axis"
# axis_field = "axis"

# Column flagging whether a row is active.
# Type: string (optional) | Default: "enabled"
# enabled_field = "enabled"

# Column carrying free-form tags joined by tag_separator.
# Type: string (optional) | Default: "tags"
# tags_field = "tags"

# Columns that must be present and non-empty per row.
# Type: tuple[str, Ellipsis] | Default: []
# required_fields = []

# Columns whose values are resolved as filesystem paths.
# Type: tuple[str, Ellipsis] | Default: []
# path_fields = []

# Separator splitting the tags column into individual tags.
# Type: string | Default: ";"
# tag_separator = ";"

# Per-field equality filters applied during catalog selection.
# Type: tuple[tuple, Ellipsis] | Default: []
# field_equals = []

# Whitelist of tags.
# Empty disables the filter.
# Type: tuple[str, Ellipsis] | Default: []
# tags = []

# Blacklist of tags applied after the whitelist.
# Type: tuple[str, Ellipsis] | Default: []
# exclude_tags = []

# When true, rows flagged as disabled are kept.
# Type: bool | Default: false
# include_disabled = false

# Most catalog rows kept.
# Unset, every selected row is kept.
# A count.
# Type: int (optional) | Optional
# limit = 0

# Optional site-selection manifest whose output names the catalog.
# Exclusive with path.
# Type: path (optional) | Optional
# source_manifest_path = ""

# Output of the site-selection manifest read as the catalog.
# Defaults to regional_lab_sites_csv.
# Type: string (optional) | Optional
# source_manifest_output_key = ""

