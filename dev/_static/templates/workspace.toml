# The set of defaults the file is read with.
# A key the file does not write takes its default in this edition, so a later version never moves a number of a file that did not ask.
# config.resolved.toml writes it.
# Type: string | Default: "2.0" | Examples: "2.0"
edition = "2.0"

# ----------------------------------------------------------------------
# Strict-binary workspace configuration.
# ----------------------------------------------------------------------

[workspace]
# Explicit shared data workspace root.
# When set, derives data_dir unless it is overridden.
# Result catalogs stay project-local by default.
# Type: UnionType[Path, UPath, NoneType] | Optional | Examples: "../.."
# root = ""

# Folder the input data are read from and downloads are cached in.
# Unset, it is <root>/data.
# Type: path (optional) | Optional
# data_dir = ""

# Size cap of the product store under .hmp/products/, in megabytes.
# The oldest products go first when a run writes past it.
# Type: int | >= 1 | Default: 5000
products_cap_mb = 5000

