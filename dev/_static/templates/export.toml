# ----------------------------------------------------------------------
# One export: what to write, when, in which format, where.
# ----------------------------------------------------------------------

# The exports written at the end of a run, one [[export]] block per request, in the order of the file.
# Each block says what (variables), when (time or period) and where (folder or file); the format follows the data.

# Example entry, one [[export]] block per entry.
# [[export]]
# What to export: a name, a list of names, or "all" for everything the run holds.
# One namespace covers the mesh fields (head, watertable_depth, seepage_mask...), the series (discharge, discharge_obs...), the vector layers (watershed, hydrographic_network_reference...), the raster layers (watershed_dem...) and the table budget; 'hmp export <run> --list' prints what a run holds.
# A name no run can hold is refused before the solve.
# Type: UnionType[str, list] | REQUIRED | Examples: "head", ["head", "discharge"], "all"
# variables = ""

# The instants to write: a date "YYYY-MM-DD", "first", "last", or a list of them.
# A date takes the stress period that holds it.
# A format that holds one instant (GeoTIFF, Shapefile, GeoPackage, VTU) writes one file per date.
# Left out, the whole simulation is written.
# Cannot be given with period.
# Type: UnionType[str, int, list, NoneType] | Optional
# time = ""

# A window of the simulation, [start, end], two dates "YYYY-MM-DD".
# Every stress period it overlaps is written.
# Cannot be given with time.
# Type: tuple (optional) | Optional
# period = ""

# The file format.
# Left out, each data takes its natural format, or the one the extension of 'file' names.
# 'package' writes the portable .hmp archive of the run; 'stac', 'rocrate' and 'prov' write its metadata.
# Those four describe the whole run and take variables = "all" only.
# Type: ExportFormat (optional) | Optional
# format = ""

# The folder the files are written to, with automatic names.
# A relative folder is read from the project's share/ directory.
# Defaults to share/<run>/.
# Type: path (optional) | Optional
# folder = ""

# One exact file to write; its extension gives the format.
# A relative file is read from 'folder'.
# Only for a request that writes one file: several files need 'folder' and automatic names.
# Type: path (optional) | Optional
# file = ""

# Output CRS, e.g.
# 'EPSG:4326'.
# Rasters and vector layers are reprojected from the model CRS.
# NetCDF, VTU and CSV do not reproject and refuse it.
# Left out, the model CRS is kept.
# Type: string (optional) | Optional
# crs = ""

# Pixel size of a GeoTIFF of a field, in units of the output CRS.
# Derived from the mesh when left out.
# Refused on a request that writes no raster.
# Type: float (optional) | > 0 | Optional
# resolution = 1.0

