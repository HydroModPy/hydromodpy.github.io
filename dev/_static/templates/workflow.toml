# ----------------------------------------------------------------------
# Workflow selector configuration.
# ----------------------------------------------------------------------

[workflow]
# What `hmp run` does with the file.
# Unset, it follows from the sections: [calibration] calibrates, [overview] without [simulation] draws the overview, anything else simulates.
# Type: Literal (optional) | Optional
# mode = "simulation"

# How much the run prints on the console.
# The project debug log, `.hmp/logs/hydromodpy_debug.log`, records every DEBUG line whatever this says.
# `hmp run -q/-v/--debug` and the HMP_VERBOSITY environment variable both win over this field.
# Type: Literal['quiet', 'normal', 'verbose', 'debug'] | one of: "quiet", "normal", "verbose", "debug" | Default: "normal" | Examples: "normal", "quiet"
verbosity = "normal"

