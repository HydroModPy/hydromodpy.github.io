# ----------------------------------------------------------------------
# Hub aggregating every post-simulation analysis sub-section.
# ----------------------------------------------------------------------

# Optional regional-lab batch settings loaded from [analysis.batch].
# Parsed standalone via RegionalLabLauncher under the section name [regional_lab].

# [analysis.batch]
# Resolved path to the source TOML file.
# Type: path | REQUIRED
# config_path = ""

# Directory used to resolve relative paths.
# Type: path | REQUIRED
# base_dir = ""

# Name of the regional lab, used in its output paths.
# Unset, the name of the TOML file is used.
# Type: string | REQUIRED | Examples: "brittany_lab"
# lab_id = ""

# Directory where lab artifacts are written.
# Type: path | REQUIRED
# output_root = ""

# If False, the planner runs but no child workflows are launched.
# Type: bool | Default: true
# execute = true

# Materialize one sealed regional flow job for eligible child simulations.
# Type: bool | Default: false
# share_regional_flow = false

# If True, keep dispatching siblings after a child failure.
# Type: bool | Default: true
# continue_on_error = true

# If True, ensure each rendered child config path exists before run.
# Type: bool | Default: true
# validate_config_paths = true

# If True, replay the previous report to skip already-completed cases.
# Type: bool | Default: true
# resume_from_report = true

# If True, do not re-run cases marked as completed in the report.
# Type: bool | Default: true
# skip_completed_cases = true

# Optional cluster enrichment rules applied on top of the catalog.
# Type: tuple[RegionalLabClusterRuleConfig, Ellipsis] | Default: []
# cluster_rules = []

# Per-recipe expansion plans declaring which child launchers run on which sites.
# Type: tuple[RegionalLabRecipeConfig, Ellipsis] | REQUIRED
# recipes = ""


# Site catalog source declaring the columns and filters used to enumerate runs.

# [analysis.batch.catalog]
# Resolved path to the site catalog (CSV or JSONL).
# Type: path | REQUIRED | Examples: "sites.csv"
# path = ""

# Catalog format.
# 'auto' infers from suffix.
# Type: Literal['auto', 'csv', 'jsonl'] | one of: "auto", "csv", "jsonl" | Default: "auto"
# format = "auto"

# Catalog column carrying the site identifier.
# Type: string | Default: "site_id"
# site_id_field = "site_id"

# Catalog column carrying a human-readable site label.
# Type: string (optional) | Default: "site_label"
# site_label_field = "site_label"

# Catalog column carrying the cluster identifier.
# Type: string (optional) | Default: "cluster_id"
# cluster_id_field = "cluster_id"

# Catalog column carrying the cluster label.
# Type: string (optional) | Default: "cluster_label"
# cluster_label_field = "cluster_label"

# Catalog column carrying the cluster family name.
# Type: string (optional) | Default: "cluster_family"
# cluster_family_field = "cluster_family"

# Catalog column carrying the cluster spatial scale tag.
# Type: string (optional) | Default: "cluster_scale"
# cluster_scale_field = "cluster_scale"

# Catalog column carrying the region identifier.
# Type: string (optional) | Default: "region_id"
# region_field = "region_id"

# Catalog column carrying the data-source selection identifier.
# Type: string (optional) | Default: "source_selection_id"
# source_selection_field = "source_selection_id"

# Catalog column carrying the site lifecycle status.
# Type: string (optional) | Default: "site_status"
# status_field = "site_status"

# Catalog column carrying the site maturity level.
# Type: string (optional) | Default: "maturity"
# maturity_field = "maturity"

# Catalog column carrying the X coordinate (CRS units).
# Type: string (optional) | Default: "x"
# x_field = "x"

# Catalog column carrying the Y coordinate (CRS units).
# Type: string (optional) | Default: "y"
# y_field = "y"

# Catalog column carrying the catchment area in km^2.
# Type: string (optional) | Default: "area_km2"
# area_km2_field = "area_km2"

# Catalog column carrying free-form tags joined by tag_separator.
# Type: string (optional) | Default: "tags"
# tags_field = "tags"

# Catalog column flagging whether a site is active.
# Type: string (optional) | Default: "enabled"
# enabled_field = "enabled"

# Catalog columns that must be present and non-empty per row.
# Type: tuple[str, Ellipsis] | Default: []
# required_fields = []

# Catalog columns whose values are resolved as filesystem paths.
# Type: tuple[str, Ellipsis] | Default: []
# path_fields = []

# Separator splitting the tags column into individual tags.
# Type: string | Default: ";"
# tag_separator = ";"

# Optional site-selection manifest used to resolve the site catalog.
# Type: path (optional) | Optional
# source_manifest_path = ""

# Output key read from the site-selection manifest.
# Type: string (optional) | Optional
# source_manifest_output_key = ""


# Top-level site selection filters applied before cluster rules and recipes.

# [analysis.batch.selection]
# Whitelist of site identifiers to keep.
# Empty means no filter.
# Type: tuple[str, Ellipsis] | Default: []
# site_ids = []

# Whitelist of cluster identifiers to keep.
# Empty means no filter.
# Type: tuple[str, Ellipsis] | Default: []
# cluster_ids = []

# Whitelist of region identifiers to keep.
# Empty means no filter.
# Type: tuple[str, Ellipsis] | Default: []
# regions = []

# Whitelist of cluster family names to keep.
# Empty means no filter.
# Type: tuple[str, Ellipsis] | Default: []
# families = []

# Whitelist of cluster scale tags to keep.
# Empty means no filter.
# Type: tuple[str, Ellipsis] | Default: []
# scales = []

# Whitelist of site lifecycle statuses to keep.
# Empty means no filter.
# Type: tuple[str, Ellipsis] | Default: []
# statuses = []

# Whitelist of site maturity levels to keep.
# Empty means no filter.
# Type: tuple[str, Ellipsis] | Default: []
# maturity_levels = []

# Required tags.
# A site must carry every tag listed here to pass.
# Type: tuple[str, Ellipsis] | Default: []
# tags = []

# Most sites kept after filtering.
# Unset, every site that passes is kept.
# Type: int (optional) | Optional
# limit = 0

# If True, also keep sites flagged as disabled in the catalog.
# Type: bool | Default: false
# include_disabled = false


# Optional publication block copying selected run figures into a versionable capability-gallery source folder, loaded from [analysis.capability_gallery].

# [analysis.capability_gallery]
# Render (or copy) selected figures into a versionable gallery folder.
# Type: bool | Default: false
# enabled = false

# Destination directory for selected gallery assets.
# Relative paths are resolved against the TOML directory.
# Type: path (optional) | Optional
# output_dir = ""

# Stable identifier used in the gallery manifest.
# Type: string | Default: "simulation_regression_flow_case"
# case_slug = "simulation_regression_flow_case"

# Asset filenames.
# Each ``<name>.png`` is first rendered through the injected render callback when a Run is available, otherwise copied from the run's own figures directory.
# Type: tuple[str, Ellipsis] | Default: ["piezometric_map.png", "seepage_map.png", "hydrograph.png", "water_budget.png", "watershed_id_card.png"]
# assets = ["piezometric_map.png", "seepage_map.png", "hydrograph.png", "water_budget.png", "watershed_id_card.png"]


# Optional simulation-comparison block loaded from [analysis.comparison].
# Parsed standalone via SimulationComparisonConfig under the section name [comparison].

# [analysis.comparison]
# Stable identifier for this comparison run.
# Type: Annotated (optional) | Optional
# comparison_id = ""


# Generated child simulations to run in the comparison.
# At least one entry required.
# Example entry, one [[analysis.comparison.simulation]] block per entry.
# [[analysis.comparison.simulation]]
# Name of the child simulation, unique in the comparison.
# Type: string | REQUIRED | Examples: "k_low"
# id = ""

# Label of the child simulation in tables and figures.
# Unset, the id is used.
# Type: string (optional) | Optional
# label = ""

# If False, the child simulation is declared but not run.
# Type: bool | Default: true
# enabled = true

# Name of the mesh this child simulation runs on, so that children on the same mesh are grouped in the comparison outputs.
# Type: Annotated (optional) | Optional
# mesh_label = ""


# Observables to compare across the declared simulations.
# At least one entry required.
# Example entry, one [[analysis.comparison.observable]] block per entry.
# [[analysis.comparison.observable]]
# Unique identifier of this observable inside the comparison.
# Type: string | REQUIRED | Examples: "outlet_q"
# name = ""

# Name of the simulated variable to extract (e.g.
# head, discharge).
# Type: string | REQUIRED | Examples: "discharge"
# variable = ""

# Backing store for the extracted values; currently only disk outputs.
# Type: Literal['disk'] | one of: "disk" | Default: "disk"
# source = "disk"

# Subset of simulation ids this observable applies to; null means all.
# Type: list (optional) | Optional
# simulations = []

# Spatial support of the observable (point, outlet, boundary, mask, map).
# Type: Literal['point', 'outlet', 'boundary', 'cell_mask', 'map'] | one of: "point", "outlet", "boundary", "cell_mask", "map" | Default: "point"
# support = "point"

# Optional anchor key resolved from anchors_file to provide x and y.
# Type: string (optional) | Optional
# anchor_id = ""

# Easting in meters (EPSG:2154 / Lambert 93).
# Type: float (optional) | Optional
# x = 0.0

# Northing in meters (EPSG:2154 / Lambert 93).
# Type: float (optional) | Optional
# y = 0.0

# Zero-based mesh cell index for point or outlet support.
# Type: Annotated (optional) | Optional
# cell_index = ""

# List of zero-based mesh cell indices used for cell_mask support.
# Type: list (optional) | Optional
# cell_indices = []

# Identifier of the boundary group selected for boundary support.
# Type: Annotated (optional) | Optional
# boundary_id = ""

# Timestep selector (timestamp, integer index, or 'all').
# Type: UnionType[str, int, NoneType] | Default: "all"
# time = "all"

# Optional inclusive time window as a (start, end) pair, mutually exclusive with time.
# Type: UnionType[tuple, tuple, NoneType] | Optional
# time_window = ""

# Spatial reducer applied over the support (e.g.
# nearest_cell, sum, max).
# Type: string (optional) | Optional
# reducer = ""

# Temporal reducer applied over the selected timesteps (e.g.
# mean, sum).
# Type: string (optional) | Optional
# time_reducer = ""

# Optional unit label attached to the extracted values for display.
# Type: string (optional) | Optional
# unit = ""

