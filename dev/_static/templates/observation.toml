# ----------------------------------------------------------------------
# Root-level workflow selector.
# ----------------------------------------------------------------------

# The set of defaults the file is read with.
# A key the file does not write takes its default in this edition, so a later version never moves a number of a file that did not ask.
# config.resolved.toml writes it.
# Type: string | Default: "2.0" | Examples: "2.0"
edition = "2.0"

# ----------------------------------------------------------------------
# Configuration for ``[observation]``: points sampled during the run.
# ----------------------------------------------------------------------

[observation]
# Variables sampled at every point that does not name its own.
# Virtual fields (watertable_depth, seepage_mask ...) are accepted.
# Type: list[str] | Default: ["head"]
variables = ["head"]


# Observation points sampled once the run has produced its fields.
# Example entry, one [[observation.points]] block per entry.
# [[observation.points]]
# Station id of the point.
# Unique within the section.
# Type: string | REQUIRED
# id = ""

# Easting of the point in the project CRS, in meters like the mesh.
# Type: float | REQUIRED | Examples: 352400.0
# x = 0.0

# Northing of the point in the project CRS, in meters like the mesh.
# Type: float | REQUIRED | Examples: 6788300.0
# y = 0.0

# Zero-based layer index to read.
# Mutually exclusive with 'depth'.
# Type: int (optional) | Optional
# layer = 0

# Depth in metres below the local model top; picks the layer from the mesh layer thicknesses.
# Mutually exclusive with 'layer'.
# Type: float (optional) | >= 0.0 | Optional
# depth = 0.0

# Variables sampled at this point.
# Defaults to the section-level 'variables' list.
# Type: list (optional) | Optional
# variables = []

