[flow]
# Engine the Boussinesq solver uses for its nonlinear solve.
# 'local' and 'scipy' build a dense matrix and run on at most 400 cells; 'scipy_sparse' and 'petsc' (it needs petsc4py) have no such limit.
# 'auto' runs 'local' up to 400 cells and 'scipy_sparse' above, and logs the choice.
# The MODFLOW solvers do not read it.
# Type: Literal['auto', 'local', 'scipy', 'scipy_sparse', 'petsc'] | one of: "auto", "local", "scipy", "scipy_sparse", "petsc" | Default: "auto" | Examples: "auto", "scipy_sparse"
runtime_backend = "auto"

# Depth scale, in metres, of the regularized partition, the surface closure the Boussinesq solver uses by default on every engine but petsc.
# A cell whose water table lies d metres below the land surface releases at the surface the share exp(-d / depth) of the water it receives, its lateral inflow plus its recharge and wells: all of it with the water table at the surface, 37 % at one depth scale, 2e-9 at 1 m with the default 0.05 m.
# It stands for the microtopography over which seepage starts, and smooths the onset of seepage for the Newton solve.
# A smaller value comes closer to the exact threshold of the complementarity closure and makes the solve stiffer.
# The other closures and the MODFLOW solvers do not read it.
# Type: float | > 0.0 | Default: 0.05 | Examples: 0.05, 0.02
partition_release_depth_m = 0.05

# Ordered list of the flow parameter ids the run builds, for example ['K', 'Ss', 'Sy'].
# Each id is described by its [flow.param.<id>] table.
# Type: list[str] | REQUIRED | Examples: ["K", "Sy", "Ss"]
param_list = []

# Mapping of flow-parameter identifiers to native FieldParamConfig payloads.
# Type: dict[str, FlowParam] | REQUIRED

# Mapping of flow boundary-condition payloads parsed from ``[flow.bc]``.
#
# **Supported TOML sections**.
#
# - ``[flow.bc.<id>]``, one block per boundary, keyed by what it is.
# Canonical ids: ``drainage``, ``ocean``, ``stream``, ``north_side``, ``south_side``, ``east_side``, ``west_side``.
# - a boundary the registry describes entirely needs NO block: listing it in ``flow.active_bc`` is enough.
#
# **Common keys**.
#
# - ``kind``: optional, the registry supplies it; write it only to depart from the default, and only within a family (``cauchy`` and ``robin`` may be swapped, a prescribed head may not).
# - ``value``: optional on a drainage, where leaving it out derives the conductance from K; required for a prescribed head.
# - ``application_domain``: optional, the registry supplies it, and a value contradicting it is refused.
#
# **Allowed application_domain values:** ``top``, ``north side``, ``south side``, ``east side``, ``west side``.
#
# **Default units:** ``m`` for dirichlet, ``m2/s`` for cauchy/robin.
#
# **Cauchy vs Robin:** both map to the same MODFLOW ``DRN`` package; the distinction only matters for the Boussinesq solver, which uses two different surface-interaction closures (``cauchy`` for the linear formulation ``q = C(h - h_ref)``, ``robin`` for the regularized partition / complementarity variants selected by ``flow.surface_interaction_model``).
# Type: dict[str, Annotated] | REQUIRED

# Explicitly activated sink/source names for this flow run: 'recharge', 'wells', 'etp'.
# 'etp' means three things.
# Under MODFLOW-NWT the loaded ETP drives the EVT package.
# Under MODFLOW 6 it acts only in soil mode ([flow.sinks_sources.recharge.soil]), where it sends the ETP the soil left unmet to the EVT package; outside soil mode MODFLOW 6 ignores it and says so.
# Boussinesq rejects it at solver-contract validation.
# An empty list means no sink/source package is assembled by the solver.
# Type: list[Annotated] | REQUIRED | Examples: ["recharge"], ["recharge", "wells"], ["etp"]
active_sinks_sources = []

# Boundaries this run builds, by their canonical names: 'ocean', 'stream', 'north_side', 'south_side', 'east_side', 'west_side', 'drainage', 'lake', 'reservoir'.
# 'lake' and 'reservoir' build a MODFLOW 6 LAK package, so only the modflow6 solver takes them.
# An empty list builds no boundary.
# Type: list[Annotated] | REQUIRED | Examples: ["ocean"], ["west_side", "east_side", "drainage"]
active_bc = []

# Whether the flow is solved as one equilibrium state or through time over the stress periods of [simulation.time].
# Type: Literal['steady', 'transient'] | one of: "steady", "transient" | Default: "transient" | Examples: "steady", "transient"
flow_regime = "transient"

# For transient flow, mark the first solver stress period as steady-state.
# Ignored for steady flow, where all solver periods are steady.
# Type: bool | Default: true | Examples: true, false
first_period_steady = true

# Optional hotstart: path to a prior simulation Zarr store whose last time step seeds the initial heads (and the lake stage), overriding [flow.ic].
# The prior run must share this run's mesh, so enable [mesh_catchment] cache = true; otherwise the cell count differs and restart is refused.
# None keeps [flow.ic].
# Read only by a solver that declares it can: elsewhere the run is refused rather than started from [flow.ic] without a word.
# This is one of the four ways to say where a transient starts, next to [flow.ic] type='steady_state' (equilibrium under the mean recharge, or under a rate you state with source='prescribed'), type='custom'/'top'/'bottom' (a level you write), and `hmp spinup` (repeat a representative window until the state stops moving, then point this key at its result).
# Type: string (optional) | Optional
# restart_from = ""


# Example entry, one [flow.param.<id>] table per entry.
# [flow.param.<id>]
# Discriminated parameter section `[field]`.
# Type: UnionType[FieldHomogeneousSection, FieldHeterogeneousSection] | REQUIRED
# field = ""
# Optional depth profile section `[field_vertical_profile]`.
# Type: FieldVerticalProfileSection (optional) | Optional
# field_vertical_profile = ""


# Example entry, one [flow.bc.<id>] table per entry.
# Shown with kind = "dirichlet". Other variants: kind = "cauchy", kind = "robin".
# [flow.bc.<id>]
# Canonical name of the boundary, the same one flow.active_bc lists: 'drainage', 'ocean', 'stream', 'north_side', 'south_side', 'east_side' or 'west_side'.
# It fixes where the boundary applies.
# Type: string | REQUIRED | Examples: "drainage"
# id = ""
# Boundary-condition value, scalar or one value per stress period.
# On a drainage boundary it is a conductance in m2/s, and it may be left out: the run then derives it from the conductivity, C = K * cell_area / solver.drain_bed_thickness_m, which keeps the drain proportional to K and makes K/R the quantity a network calibration searches.
# A zero or negative number selects that same derivation, so it does NOT mean a closed boundary; write a positive conductance to impose one.
# Type: UnionType[float, list, NoneType] | Optional
# value = 0.0
# Free text about the boundary, kept with the configuration.
# Unset, a text naming its kind and where it applies is written.
# Type: string | Default: ""
# description = ""
# Type of the boundary: an imposed head ('dirichlet') or a drain ('cauchy', 'robin').
# Unset, the boundary's id decides.
# Type: Literal['dirichlet'] | one of: "dirichlet" | Default: "dirichlet"
# kind = "dirichlet"
# Boundary-application domain.
# Supported values are: top, north side, south side, east side, west side.
# Type: string (optional) | Optional
# application_domain = ""
# Name of a labelled group of cells or edges of a Gmsh mesh.
# The boundary then applies there instead of on the group its id selects.
# MODFLOW 6 and Boussinesq read it.
# Type: Annotated (optional) | Optional
# support_label = ""


# Validated flow initial-condition structure parsed from [flow.ic].
# Stored as FlowInitialConditions(h=FlowInitialCondition).

[flow.ic]
# Number the starting state reads, in metres: the head for type 'custom', the depth below the top for type 'top_offset'.
# The other types refuse it.
# Type: object (optional) | Optional
# value = ""

# Free text about the starting state, kept with the configuration.
# Unset, it reads "Initial condition 'h'".
# Type: string | Default: ""
description = ""

# Initialize head at the top surface (full aquifer).
# Type: Literal['top'] | one of: "top" | Default: "top"
type = "top"


# Typed sinks/sources payload (for example pumping wells).

[flow.sinks_sources]
