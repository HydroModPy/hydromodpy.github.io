# Example entry, one [flow.sinks_sources.lakes.<id>] table per entry.
# [flow.sinks_sources.lakes.<id>]
# Lake-bed leakance [1/T] = K_bed / thickness_bed.
# Resistance of the lake-aquifer interface; the under-dam leakage calibration parameter.
# 0 means a perfectly sealed lakebed (no leakage).
# Type: float | >= 0.0 | REQUIRED | Examples: 1e-06
# bedleak = 0.0
# Unit of bedleak (leakance, 1/T): one of 1/s, 1/day, 1/h, 1/min (aliases like 1/d accepted).
# HydroModPy converts it to 1/s for MF6, so a 1/day leakance is not silently taken as 1/s.
# Type: string | Default: "1/s"
# bedleak_unit = "1/s"
# Lake stage at the start of the run: the elevation of the water surface, in metres.
# Type: Any | REQUIRED | Examples: 45.0
# stageinit = ""
# Hold the lake stage at stageinit during the steady warm-up period(s) (LAK status CONSTANT) and re-activate it on the first transient period.
# Use for a managed reservoir whose observed initial level is far from the natural steady equilibrium: the aquifer equilibrates around the observed stage instead of overriding it.
# Type: bool | Default: false
# steady_stage_hold = false
# Number of top grid layers the lake occupies in each of its columns.
# 1 is a surface lake; a deeper reservoir embedded over several layers uses a higher count.
# Must leave at least one active layer below the lake for the VERTICAL leakage connection.
# A count of layers.
# Type: int | >= 1 | Default: 1
# occupied_layers = 1
# Fill cells enclosed by the lake footprint (the polygon's interior rings / islands) so the lake is contiguous.
# Off by default: interior rings stay active aquifer (real islands).
# Enable to drop sub-grid islands and classification pockets that would otherwise be isolated non-lake cells inside the lake.
# Type: bool | Default: false
# fill_enclosed_cells = false
# Optional bathymetry-driven bed carving.
# When set, the real lake bed is reconstructed from the lake_bathymetry raster (reconciled to the abacus) and carved into the grid instead of a flat reservoir.
# Type: BathymetryReconstructionConfig (optional) | Optional
# bed_reconstruction = ""
# Surverse / spillway / controlled-release outlets for this lake.
# Type: list[Annotated] | REQUIRED
# outlets = []
# Optional dam cutoff wall / grout curtain on the dam axis, modeled as a MODFLOW 6 HFB (the lake-derived use of FlowBarrierConfig).
# The barrier forces the under-dam seepage to dive below the wall instead of leaking through the top layers.
# Type: FlowBarrierConfig (optional) | Optional
# cutoff_wall = ""
# Rainfall on the lake over time, as a rate per unit of lake surface (m/s in SI).
# It wins over the rainfall taken from [data.precipitation].
# Type: Annotated (optional) | Optional
# rainfall = ""
# Open-water evaporation over time, as a rate per unit of lake surface (m/s in SI).
# It wins over the evaporation taken from [data.etp].
# Type: Annotated (optional) | Optional
# evaporation = ""
# Runoff that enters the lake over time, as a volume per time (m3/s in SI).
# It wins over the runoff taken from [data.runoff].
# Type: Annotated (optional) | Optional
# runoff = ""
# Other inflow to the lake over time, as a volume per time (m3/s in SI).
# Type: Annotated (optional) | Optional
# inflow = ""
# Rate of water taken from the lake over time, as a volume per time (m3/s in SI), written positive.
# It is passed to the WITHDRAWAL setting of MODFLOW 6 LAK, which reads every lake forcing as zero or more.
# Type: Annotated (optional) | Optional
# withdrawal = ""


# Example entry, one [flow.sinks_sources.sfr.<id>] table per entry.
# [flow.sinks_sources.sfr.<id>]
# Prune reaches shorter than this [L] (0 keeps all reaches).
# Type: Any | Default: "0 m"
# min_reach_length = "0 m"
# Manning roughness coefficient n [T/L^(1/3)] (> 0).
# Default 0.035.
# Type: float | > 0.0 | Default: 0.035
# manning = 0.035
# Streambed hydraulic conductivity rhk [L/T].
# 0 = no reach-aquifer leakage (pure routing).
# Type: float | >= 0.0 | Default: 1e-06
# streambed_k = 1e-06
# Unit of streambed_k (velocity, L/T): m/s, m/day, m/h..
# HydroModPy converts it to m/s for MF6, so a m/day value is not taken as m/s.
# Type: string | Default: "m/s"
# streambed_k_unit = "m/s"
# Streambed thickness rbth [L] (> 0).
# Type: Any | Default: "1 m"
# streambed_thickness = "1 m"
# Smallest slope a reach bed may take, in metres of drop per metre (floor of rgrd).
# It also sets the drop the bed profile solve keeps between neighbouring reaches.
# Type: float | > 0.0 | Default: 0.0001
# min_slope = 0.0001
# Depth [L] of the streambed top rtp below the top of the reach's OWN aquifer cell.
# A bed never sits above the ground of its own cell, whether this is set or not.
# None (default) only lifts the lower bound: the bed may then sink to the cell bottom instead of stopping at max_bed_sag.
# When set, each reach is solved inside [cell_top - bed_incision - max_bed_sag, cell_top - bed_incision], monotone downstream, and the build refuses when that band is empty.
# rtp is delineated on the model top, so this anchors a bed that a coarse DEM cannot resolve; it is not a correction for the descent D, which never reaches the bed.
# Pick it against the water table, not against the channel: MODFLOW 6 switches a reach between connected and disconnected at rtp minus streambed_thickness (gwf-sfr.f90:3973-3985), so a bed sitting near the seasonal water-table depth toggles at every outer iteration.
# Type: Annotated (optional) | Optional
# bed_incision = ""
# How the reach width rwid [L] is set (constant / by_order / power_law).
# Type: UnionType[FlowReachWidthConstant, FlowReachWidthByOrder, FlowReachWidthPowerLaw] | REQUIRED
# width = ""
# If False every reach uses cellid 'none' (routing only, no streambed leakage).
# Type: bool | Default: true
# connected_to_aquifer = true
# Route the hillslope drainage (DRN) discharge into the stream network: every remaining DRN cell of the basin hands its outflow, through an MVR record (FACTOR 1.0), to the first reach or lake cell met on its descent D, a filled copy of the model top.
# A cell whose descent leaves the model first keeps a plain DRN.
# This is the surface re-infiltration / runon convergence of drained water towards the river; without it only the reach cells' streambed captures baseflow and the rest of the catchment discharge is lost.
# Type: bool | Default: false
# route_drainage = false
# Enable the channel-storage term (transient first period / SIMPLE only).
# Type: bool | Default: false
# storage = false
# Inflow from outside the model at the headwater reaches, as a volume per time (m3/s in SI).
# Type: Annotated (optional) | Optional
# headwater_inflow = ""
# Overland runoff that enters the network, as a volume per time (m3/s in SI), shared over the reaches by length.
# Type: Annotated (optional) | Optional
# runoff = ""
# Rainfall on the channel surface, as a rate (m/s in SI).
# Type: Annotated (optional) | Optional
# rainfall = ""
# Evaporation from the channel surface, as a positive rate (m/s in SI) that is subtracted.
# Type: Annotated (optional) | Optional
# evaporation = ""
# SFR-to-SFR diversions (controlled splits).
# Empty = none.
# Type: list[FlowReachDiversionConfig] | REQUIRED
# diversions = []
# Number of the lake the last reach feeds through a mover (SFR -> LAK), counted from 1 in the order the lakes are declared.
# Unset, the network outflow leaves the model.
# Type: int (optional) | >= 1 | Optional
# outflow_to_lake = 1
# How much of the network outflow the mover passes to the lake, given outflow_value.
# Type: Literal['FACTOR', 'UPTO', 'EXCESS', 'THRESHOLD'] | one of: "FACTOR", "UPTO", "EXCESS", "THRESHOLD" | Default: "FACTOR"
# outflow_mvrtype = "FACTOR"
# Amount of the transfer rule: a share from 0 to 1 for FACTOR, a flow rate in m3/s for UPTO, EXCESS and THRESHOLD.
# Not calibratable: it is a coupling rule, not a hydraulic property of the reach or the lake, so letting a search move it would buy fit by reshaping how water is split between them rather than resolve streambed_k or the lake bathymetry, the actual unknowns.
# path = in [calibration.parameters] still reaches it for whoever wants to override this deliberately.
# Type: float | >= 0.0 | Default: 1.0
# outflow_value = 1.0


# Example entry, one [flow.sinks_sources.flow_barriers.<id>] table per entry.
# [flow.sinks_sources.flow_barriers.<id>]
# Auto-place the dam cutoff wall (lakes only): the trace is derived at bind time as the chord across the reservoir at its downstream neck (the footprint point nearest the catchment outlet), perpendicular to the outlet-flow direction.
# Mutually exclusive with line / line_path; the mesh dam refinement then follows this auto axis too.
# Type: bool | Default: false
# auto = false
# Inline barrier-trace vertices [(x, y), ...] in the project CRS.
# Mutually exclusive with line_path and auto.
# Type: list (optional) | Optional
# line = []
# Barrier-trace file: a vector polyline (gpkg / shp / GeoJSON) or a CSV of ordered x,y (or lon,lat) vertices.
# A bare filename resolves against <workspace>/data/cutoff_wall/.
# Alternative to line and auto.
# Type: path (optional) | Optional
# line_path = ""
# Barrier depth [m] below the top (or below crest_elevation).
# One value is uniform; several are interpolated per vertex along the trace.
# The HFB blocks every layer down to this depth.
# Mutually exclusive with base_elevation.
# Type: list (optional) | Optional
# depths = []
# Absolute TOP elevation of the barrier [m, model datum]; defaults to the cell top (the DEM).
# Set it when the barrier crest sits below the DEM top.
# Not calibratable: raising the crest and lowering hydchr both shrink the flow section the wall lets through, so a search cannot tell the two apart.
# It is a built structure, not a fitted number; path = in [calibration.parameters] still reaches it for whoever wants to override this deliberately.
# Type: float (optional) | Optional
# crest_elevation = 0.0
# Absolute BOTTOM elevation of the barrier [m, model datum].
# When set, the HFB spans [base_elevation, crest_elevation or top] and blocks EVERY layer in that band.
# Use it to make a full-height dam impervious: the concrete body plus the grout curtain block all flow from the crest down to the curtain foot (e.g.
# base_elevation = 41 m), so nothing seeps across the dam above that.
# Mutually exclusive with depths.
# Not calibratable: a deeper foot and a lower hydchr produce the same reduction of under-dam flow, so putting both in a search is equifinality by construction, the same mechanism that makes the second stage of the stream-network protocol pin the specific yield on its bound.
# When the foot is genuinely unknown, run mode = "comparison", one elevation per run, which also yields a defensible sensitivity instead of a fitted number; path = in [calibration.parameters] still reaches it for an override.
# Type: float (optional) | Optional
# base_elevation = 0.0
# HFB hydraulic characteristic [1/T] = K_barrier / thickness_barrier.
# A near-zero value (e.g.
# 1e-9 1/s) is a quasi-impermeable wall.
# Mutually exclusive with k + thickness.
# Type: float (optional) | >= 0.0 | Optional
# hydchr = 0.0
# Unit of hydchr (1/T): 1/s, 1/day, 1/h, 1/min.
# Converted to 1/s for MF6.
# Type: string | Default: "1/s"
# hydchr_unit = "1/s"
# Barrier hydraulic conductivity [L/T]; used with thickness when hydchr is unset.
# Type: float (optional) | > 0.0 | Optional
# k = 1.0
# Unit of k (L/T): m/s, m/day, m/h, m/min.
# Converted to m/s.
# Type: string | Default: "m/s"
# k_unit = "m/s"
# Thickness of the barrier, in the unit thickness_unit names (metres by default).
# With k it gives hydchr = k / thickness when hydchr is unset.
# Type: float (optional) | > 0.0 | Optional
# thickness = 1.0
# Unit of thickness (L): m, cm, mm, km.
# Converted to m.
# Type: string | Default: "m"
# thickness_unit = "m"


# Diffuse recharge configuration.
# None = zero recharge for all periods.

# [flow.sinks_sources.recharge]
# Recharge rate: one number, one number per stress period, a table {period: value}, or the series loaded from [data.recharge], in the unit that 'units' names (mm/day by default).
# A calibration reads its bounds in that unit too.
# The 'matching_hydrographic_network' protocol calibrates conductivity against the ratio K/R in its steady stage and requires this value held frozen there.
# Type: Any | Default: 0.0
# values = 0.0

# Unit of 'values' and of the recharge data source.
# Data-manager outputs use mm/day by convention; set it when you write 'values' in another unit.
# The run converts the rate to m/s.
# Type: string | Default: "mm/day" | Examples: "mm/day", "m/day", "m/s"
# units = "mm/day"


# Soil reservoir that computes the recharge from the daily precipitation and ETP loaded under [data.precipitation] and [data.etp], MODFLOW 6 only.
# It replaces [data.recharge].
# Check it alone with `hmp run <file> --until load_data`, which prints its water budget in mm/year and writes no run.

# [flow.sinks_sources.recharge.soil]
# Available water capacity of the soil, in mm of water: what the roots can draw between field capacity and wilting point.
# A bare number is in mm; "120 mm" and "12 cm" also read.
# Between 0 and 1000 mm.
# Required, since it belongs to the site.
# In doubt, start from 150 mm and compare the recharge the soil alone prints for 50 to 250 mm with the gauged discharge (hmp run <file> --until load_data).
# With [data.soil_capacity], it is the mean capacity of the SAFRAN cells, and the raster spreads it over classes inside each cell.
# Calibrate it with [calibration.parameters.ru].
# Type: float | >= 0.0 | <= 1000.0 | REQUIRED | Examples: "150 mm"
# ru = 0.0

# Share of ru above which the soil evaporates at the full rate kc x ETP.
# Below alpha x ru, ETR falls linearly with the stored water.
# It is 1 - p of FAO-56 and LP of HBV.
# Above 0, at most 1.
# Kept fixed by default: the discharge alone hardly constrains it.
# Type: float | > 0.0 | <= 1.0 | Default: 0.6
# alpha = 0.6

# Crop coefficient applied to the loaded ETP: the soil evaporates at most kc x ETP a day.
# 1.0 takes the ETP as loaded, a reference grass.
# Between 0 and 2.
# Kept fixed by default: kc and ru move the same annual volume.
# Type: float | >= 0.0 | <= 2.0 | Default: 1.0
# kc = 1.0

# Share of the area that is sealed (roofs, roads).
# The rain that falls on it runs off at once, with no infiltration and no evaporation, and reaches the streams, the lakes and the gauged discharge.
# The soil reservoir covers the rest of the area.
# From 0 up to, not including, 1.
# Calibrate it with [calibration.parameters.impervious_fraction]; the range belongs to the site, so a file has to state it.
# Type: float | >= 0.0 | < 1.0 | Default: 0.0
# impervious_fraction = 0.0

# Share of the rain on the unsealed area that skips the soil through macropores and joins the recharge the same day, even when the soil is dry.
# From 0 up to, not including, 1.
# Keep it at 0 while K and Sy are calibrated: a bypass can rebuild the summer recharge the soil reservoir removes.
# Type: float | >= 0.0 | < 1.0 | Default: 0.0
# bypass_fraction = 0.0

# Mean time the water leaving the soil takes to cross the unsaturated zone down to the water table, in days.
# A linear reservoir with this time constant delays and smooths the recharge; 0 sends it the same day.
# A bare number is in days; "5 days" also reads.
# At most 30 days: a longer delay would rebuild the slow groundwater memory MODFLOW computes itself.
# Type: float | >= 0.0 | <= 30.0 | Default: 0.0
# transit_time = 0.0

# SCS curve number (AMC II), dimensionless, of a HELP-style surface runoff (Schroeder et al.
# 1994): the unsealed share of the rain above a daily retention loses some to a fast runoff, more as the soil is wetter.
# None turns the term off, bit for bit as before.
# Between 30 and 98; the calibrated value tends to exceed the tabulated one, since SAFRAN rain is smoothed over 8 km cells.
# Calibrate it with [calibration.parameters.curve_number].
# Type: float (optional) | >= 30.0 | <= 98.0 | Optional
# curve_number = 30.0

# Time constant of the linear reservoir that routes the curve-number runoff to the outlet, in days.
# Read only when curve_number is set.
# 0 sends it the same day; "2 days" also reads.
# Between 0 and 10 days: a longer delay would smooth away the fast surface peak the term exists for.
# Type: float | >= 0.0 | <= 10.0 | Default: 1.0
# runoff_time = 1.0

# Pure delay applied to the routed curve-number runoff, after runoff_time, before it reaches the gauged discharge: the travel time to the outlet plus any lag between the forcing's daily step and the gauge's.
# Read only when curve_number is set.
# 0 adds no delay, bit for bit as before; "0.75 days" also reads, interpolated linearly between the neighbouring whole-day shifts.
# Between 0 and 5 days: a longer shift belongs to runoff_time's reservoir, not to a fixed travel time.
# Calibrate it with [calibration.parameters.runoff_lag].
# Type: float | >= 0.0 | <= 5.0 | Default: 0.0
# runoff_lag = 0.0

# State of the soil on the first day.
# "first_year" repeats the first 365 days of the run until the storage at the end of that year moves by less than 0.1 mm, 20 times at most; the run must last one year at least.
# "none" starts from a full soil, the state of a soil in a wet winter.
# Type: Literal['first_year', 'none'] | one of: "first_year", "none" | Default: "first_year"
# spinup = "first_year"


# Diffuse evapotranspiration configuration.
# None = no EVT package built.

# [flow.sinks_sources.etp]
# Evapotranspiration rate, in the unit that units names (mm/day by default): one number, one number per stress period, a table {period: value}, or the series loaded from [data.etp].
# Values must not be negative: the EVT package takes them as outflow rates.
# Type: Any | Default: 0.0
# values = 0.0

# Depth (m) below the EVT surface where the water table stops evaporating; the rate falls linearly between the surface and this depth.
# 1 m by default.
# Read by MODFLOW-NWT, and by MODFLOW 6 in soil mode for the ETP the soil left unmet.
# Calibrate it with [calibration.parameters.extinction_depth]; the range belongs to the site, so a file has to state it.
# Type: float | > 0.0 | Default: 1.0
# extinction_depth = 1.0


# ----------------------------------------------------------------------
# Flow field parameters - one [flow.param.<id>.field] per id declared in
# [flow].param_list. Example block below for K, Sy, Ss.
# ----------------------------------------------------------------------

# ----------------------------------------------------------------------
# Schema for homogeneous `[field]` payloads.
# ----------------------------------------------------------------------

[flow.param.K.field]
# Parameter identifier used in outputs and logs (for example 'K', 'Sy').
# Type: Annotated (optional) | Optional
id = "K"

# How the parameter varies in space: one value everywhere ('homogeneous') or one value per zone ('heterogeneous').
# Type: Literal['homogeneous'] | one of: "homogeneous" | Default: "homogeneous"
kind = "homogeneous"

# Unit of parameter values.
# Typical examples: 'm/s' (K), '-' (Sy), 'm-1' (Ss).
# Type: string (optional) | Optional
unit = "m/s"

# Value of the parameter over the whole domain: a number in the unit that unit names, or a text with its unit such as '1e-5 m/s'.
# Type: object (optional) | Optional | Examples: "1e-5 m/s"
# value = ""


# ----------------------------------------------------------------------
# Schema for homogeneous `[field]` payloads.
# ----------------------------------------------------------------------

[flow.param.Sy.field]
# Parameter identifier used in outputs and logs (for example 'K', 'Sy').
# Type: Annotated (optional) | Optional
id = "Sy"

# How the parameter varies in space: one value everywhere ('homogeneous') or one value per zone ('heterogeneous').
# Type: Literal['homogeneous'] | one of: "homogeneous" | Default: "homogeneous"
kind = "homogeneous"

# Unit of parameter values.
# Typical examples: 'm/s' (K), '-' (Sy), 'm-1' (Ss).
# Type: string (optional) | Optional
unit = "-"

# Value of the parameter over the whole domain: a number in the unit that unit names, or a text with its unit such as '1e-5 m/s'.
# Type: object (optional) | Optional | Examples: "1e-5 m/s"
# value = ""


# ----------------------------------------------------------------------
# Schema for homogeneous `[field]` payloads.
# ----------------------------------------------------------------------

[flow.param.Ss.field]
# Parameter identifier used in outputs and logs (for example 'K', 'Sy').
# Type: Annotated (optional) | Optional
id = "Ss"

# How the parameter varies in space: one value everywhere ('homogeneous') or one value per zone ('heterogeneous').
# Type: Literal['homogeneous'] | one of: "homogeneous" | Default: "homogeneous"
kind = "homogeneous"

# Unit of parameter values.
# Typical examples: 'm/s' (K), '-' (Sy), 'm-1' (Ss).
# Type: string (optional) | Optional
unit = "1/m"

# Value of the parameter over the whole domain: a number in the unit that unit names, or a text with its unit such as '1e-5 m/s'.
# Type: object (optional) | Optional | Examples: "1e-5 m/s"
# value = ""


# ----------------------------------------------------------------------
# Flow boundary conditions. A boundary is keyed by WHAT IT IS,
# [flow.bc.<id>], with the canonical ids and their kind, domain
# and units held by the flow boundary-condition registry.
# A boundary the registry describes entirely needs no block at
# all: listing it in [flow].active_bc is enough. Write a block
# only to depart from that default, for instance to impose a
# conductance, or kind = 'robin' instead of the drainage default.
# ----------------------------------------------------------------------

# ----------------------------------------------------------------------
# Normalized flow boundary-condition payload.
# ----------------------------------------------------------------------

[flow.bc.drainage]
# Canonical name of the boundary, the same one flow.active_bc lists: 'drainage', 'ocean', 'stream', 'north_side', 'south_side', 'east_side' or 'west_side'.
# It fixes where the boundary applies.
# Type: string | REQUIRED | Examples: "drainage"
id = ""

# Boundary-condition value, scalar or one value per stress period.
# On a drainage boundary it is a conductance in m2/s, and it may be left out: the run then derives it from the conductivity, C = K * cell_area / solver.drain_bed_thickness_m, which keeps the drain proportional to K and makes K/R the quantity a network calibration searches.
# A zero or negative number selects that same derivation, so it does NOT mean a closed boundary; write a positive conductance to impose one.
# Type: UnionType[float, list, NoneType] | Optional
# value = 0.0

# Free text about the boundary, kept with the configuration.
# Unset, a text naming its kind and where it applies is written.
# Type: string | Default: ""
description = ""

# Type of the boundary: an imposed head ('dirichlet') or a drain ('cauchy', 'robin').
# Unset, the boundary's id decides.
# Type: Literal['dirichlet', 'cauchy', 'robin'] | one of: "dirichlet", "cauchy", "robin" | Default: "dirichlet"
kind = "dirichlet"

# Boundary-application domain.
# Supported values are: top, north side, south side, east side, west side.
# Type: string (optional) | Optional
# application_domain = ""

# Name of a labelled group of cells or edges of a Gmsh mesh.
# The boundary then applies there instead of on the group its id selects.
# MODFLOW 6 and Boussinesq read it.
# Type: Annotated (optional) | Optional
# support_label = ""


# ----------------------------------------------------------------------
# Flow diffuse recharge - emitted when 'recharge' is listed in
# [flow].active_sinks_sources. Values are taken from the data
# layer ([data.recharge]) unless overridden here.
# ----------------------------------------------------------------------

# ----------------------------------------------------------------------
# Typed payload for diffuse recharge over the model domain.
# ----------------------------------------------------------------------

[flow.sinks_sources.recharge]
# Recharge rate: one number, one number per stress period, a table {period: value}, or the series loaded from [data.recharge], in the unit that 'units' names (mm/day by default).
# A calibration reads its bounds in that unit too.
# The 'matching_hydrographic_network' protocol calibrates conductivity against the ratio K/R in its steady stage and requires this value held frozen there.
# Type: Any | Default: 0.0
values = 0.0

# Unit of 'values' and of the recharge data source.
# Data-manager outputs use mm/day by convention; set it when you write 'values' in another unit.
# The run converts the rate to m/s.
# Type: string | Default: "mm/day" | Examples: "mm/day", "m/day", "m/s"
units = "mm/day"


# Soil reservoir that computes the recharge from the daily precipitation and ETP loaded under [data.precipitation] and [data.etp], MODFLOW 6 only.
# It replaces [data.recharge].
# Check it alone with `hmp run <file> --until load_data`, which prints its water budget in mm/year and writes no run.

# [flow.sinks_sources.recharge.soil]
# Available water capacity of the soil, in mm of water: what the roots can draw between field capacity and wilting point.
# A bare number is in mm; "120 mm" and "12 cm" also read.
# Between 0 and 1000 mm.
# Required, since it belongs to the site.
# In doubt, start from 150 mm and compare the recharge the soil alone prints for 50 to 250 mm with the gauged discharge (hmp run <file> --until load_data).
# With [data.soil_capacity], it is the mean capacity of the SAFRAN cells, and the raster spreads it over classes inside each cell.
# Calibrate it with [calibration.parameters.ru].
# Type: float | >= 0.0 | <= 1000.0 | REQUIRED | Examples: "150 mm"
# ru = 0.0

# Share of ru above which the soil evaporates at the full rate kc x ETP.
# Below alpha x ru, ETR falls linearly with the stored water.
# It is 1 - p of FAO-56 and LP of HBV.
# Above 0, at most 1.
# Kept fixed by default: the discharge alone hardly constrains it.
# Type: float | > 0.0 | <= 1.0 | Default: 0.6
# alpha = 0.6

# Crop coefficient applied to the loaded ETP: the soil evaporates at most kc x ETP a day.
# 1.0 takes the ETP as loaded, a reference grass.
# Between 0 and 2.
# Kept fixed by default: kc and ru move the same annual volume.
# Type: float | >= 0.0 | <= 2.0 | Default: 1.0
# kc = 1.0

# Share of the area that is sealed (roofs, roads).
# The rain that falls on it runs off at once, with no infiltration and no evaporation, and reaches the streams, the lakes and the gauged discharge.
# The soil reservoir covers the rest of the area.
# From 0 up to, not including, 1.
# Calibrate it with [calibration.parameters.impervious_fraction]; the range belongs to the site, so a file has to state it.
# Type: float | >= 0.0 | < 1.0 | Default: 0.0
# impervious_fraction = 0.0

# Share of the rain on the unsealed area that skips the soil through macropores and joins the recharge the same day, even when the soil is dry.
# From 0 up to, not including, 1.
# Keep it at 0 while K and Sy are calibrated: a bypass can rebuild the summer recharge the soil reservoir removes.
# Type: float | >= 0.0 | < 1.0 | Default: 0.0
# bypass_fraction = 0.0

# Mean time the water leaving the soil takes to cross the unsaturated zone down to the water table, in days.
# A linear reservoir with this time constant delays and smooths the recharge; 0 sends it the same day.
# A bare number is in days; "5 days" also reads.
# At most 30 days: a longer delay would rebuild the slow groundwater memory MODFLOW computes itself.
# Type: float | >= 0.0 | <= 30.0 | Default: 0.0
# transit_time = 0.0

# SCS curve number (AMC II), dimensionless, of a HELP-style surface runoff (Schroeder et al.
# 1994): the unsealed share of the rain above a daily retention loses some to a fast runoff, more as the soil is wetter.
# None turns the term off, bit for bit as before.
# Between 30 and 98; the calibrated value tends to exceed the tabulated one, since SAFRAN rain is smoothed over 8 km cells.
# Calibrate it with [calibration.parameters.curve_number].
# Type: float (optional) | >= 30.0 | <= 98.0 | Optional
# curve_number = 30.0

# Time constant of the linear reservoir that routes the curve-number runoff to the outlet, in days.
# Read only when curve_number is set.
# 0 sends it the same day; "2 days" also reads.
# Between 0 and 10 days: a longer delay would smooth away the fast surface peak the term exists for.
# Type: float | >= 0.0 | <= 10.0 | Default: 1.0
# runoff_time = 1.0

# Pure delay applied to the routed curve-number runoff, after runoff_time, before it reaches the gauged discharge: the travel time to the outlet plus any lag between the forcing's daily step and the gauge's.
# Read only when curve_number is set.
# 0 adds no delay, bit for bit as before; "0.75 days" also reads, interpolated linearly between the neighbouring whole-day shifts.
# Between 0 and 5 days: a longer shift belongs to runoff_time's reservoir, not to a fixed travel time.
# Calibrate it with [calibration.parameters.runoff_lag].
# Type: float | >= 0.0 | <= 5.0 | Default: 0.0
# runoff_lag = 0.0

# State of the soil on the first day.
# "first_year" repeats the first 365 days of the run until the storage at the end of that year moves by less than 0.1 mm, 20 times at most; the run must last one year at least.
# "none" starts from a full soil, the state of a soil in a wet winter.
# Type: Literal['first_year', 'none'] | one of: "first_year", "none" | Default: "first_year"
# spinup = "first_year"

