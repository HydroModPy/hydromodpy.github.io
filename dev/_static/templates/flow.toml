# ----------------------------------------------------------------------
# Flow boundary conditions. A boundary is keyed by WHAT IT IS,
# [flow.bc.<id>], with the canonical ids and their kind, domain
# and units held by the flow boundary-condition registry.
# Declaring a block is what activates the boundary. A boundary the
# registry describes entirely takes an empty block. Write keys
# only to depart from that default, for instance to impose a
# conductance. enabled = false keeps the block and switches it off.
# ----------------------------------------------------------------------

# ----------------------------------------------------------------------
# Normalized flow boundary-condition payload.
# ----------------------------------------------------------------------

[flow.bc.drainage]
# Whether the run builds this boundary.
# Declaring it is what activates it.
# false keeps the table and builds nothing from it.
# Type: bool | Default: true
enabled = true

# Canonical name of the boundary, the key of its [flow.bc.<id>] table: 'drainage', 'ocean', 'stream', 'north_side', 'south_side', 'east_side' or 'west_side'.
# It fixes where the boundary applies.
# Type: string | REQUIRED | Examples: "drainage"
id = ""

# Boundary-condition value, scalar or one value per stress period.
# On a head boundary it is the head in metres; left out with no forcing, the table only activates the boundary and no constant head is built.
# On a drainage boundary it is a conductance in m2/s, and it may be left out: the run then derives it from the conductivity, C = K * cell_area / solver.drain_bed_thickness_m, which keeps the drain proportional to K and makes K/R the quantity a network calibration searches.
# A zero or negative number selects that same derivation, so it does NOT mean a closed boundary; write a positive conductance to impose one.
# Type: UnionType[float, list, NoneType] | Optional
# value = 0.0

# Free text about the boundary, kept with the configuration.
# Unset, a text naming its kind and where it applies is written.
# Type: string | Default: ""
description = ""

# Type of the boundary: an imposed head ('dirichlet') or a linear drain ('drain').
# Unset, the boundary's id decides.
# Type: Literal['dirichlet', 'drain'] | one of: "dirichlet", "drain" | Default: "dirichlet"
kind = "dirichlet"

# Boundary-application domain.
# Supported values are: top, north side, south side, east side, west side.
# Type: string (optional) | Optional
# application_domain = ""

# Name of a labelled group of cells or edges of a Gmsh mesh.
# The boundary then applies there instead of on the group its id selects.
# MODFLOW 6 and Boussinesq read it.
# Type: Annotated (optional) | Optional
# support_label = ""


# ----------------------------------------------------------------------
# Flow diffuse recharge - declaring the table activates it. A series
# loaded from [data.recharge]
# or computed by the soil section replaces values.
# ----------------------------------------------------------------------

# ----------------------------------------------------------------------
# Typed payload for diffuse recharge over the model domain.
# ----------------------------------------------------------------------

[flow.sinks_sources.recharge]
# Whether the model receives this recharge.
# Declaring it is what activates it.
# false keeps the table and builds nothing from it.
# Type: bool | Default: true
enabled = true

# Recharge rate: one number, one number per stress period, or a table {period: value} that states every period, in the unit that 'units' names (mm/day by default).
# It is positive when water enters the aquifer; a negative rate leaves it, through the EVT package when negative_to_evt holds.
# A calibration reads its bounds in that unit too.
# Do not write it beside [data.recharge] or the soil section, which replace it.
# Type: Any | Default: 0.0
values = 0.0

# Number that multiplies the recharge in force, from 'values' or from [data.recharge], a deficit and a numeric first_clim included.
# 1 changes nothing.
# Do not write it beside the soil section, whose recharge is an output.
# Type: float | > 0.0 | Default: 1.0
factor = 1.0

# Unit of 'values' and of the recharge data source.
# Data-manager outputs use mm/day by convention; set it when you write 'values' in another unit.
# The run converts the rate to m/s.
# Type: string | Default: "mm/day" | Examples: "mm/day", "m/day", "m/s"
units = "mm/day"


# Soil reservoir that computes the recharge from the daily precipitation and ETP loaded under [data.precipitation] and [data.etp], MODFLOW 6 only.
# It replaces [data.recharge].
# Check it alone with `hmp run <file> --until load_data`, which prints its water budget in mm/year and writes no run.

# [flow.sinks_sources.recharge.soil]
# Storage law of the soil, the one thing that differs between methods.
# "fao56" lowers ETR linearly below alpha x ru (Allen et al.
# 1998).
# "thornthwaite" meets the full demand while water is left (Thornthwaite 1948).
# "dingman" empties the soil as an exponential of the deficit on dry days (Dingman 2008).
# "edijatno_michel" is the production store of GR4J without its percolation (Edijatno and Michel 1989).
# The sealed share, the curve number, the bypass, the transit and the snow work the same around every law.
# Type: string | Default: "fao56" | Examples: "fao56", "thornthwaite"
# method = "fao56"

# Available water capacity of the soil, in mm of water: what the roots can draw between field capacity and wilting point.
# A bare number is in mm; "120 mm" and "12 cm" also read.
# Between 0 and 1000 mm.
# Required, since it belongs to the site.
# Start from a soil map, then compare the recharge the soil alone prints for 50 to 250 mm with the gauged discharge (hmp run <file> --until load_data).
# With [data.soil_capacity], it is the mean capacity over the catchment, and the raster spreads it over classes inside each cell.
# Calibrate it with [calibration.parameters.ru].
# Type: float | >= 0.0 | <= 1000.0 | REQUIRED | Examples: "150 mm"
# ru = 0.0

# Share of ru above which the soil evaporates at the full rate kc x ETP.
# Below alpha x ru, ETR falls linearly with the stored water.
# It is 1 - p of FAO-56 and LP of HBV.
# The default 0.45 is a choice: it means p = 0.55, the value of FAO-56 table 22 for cereals and maize (pasture 0.60).
# Above 0, at most 1.
# Kept fixed by default: on the discharge alone it trades off with ru, since both move the annual volume.
