# Type: UnionType[FlowWellLocationCell, FlowWellLocationAbsoluteXY, FlowWellLocationRelativeXY] | REQUIRED
# location = ""
# Well rate [L^3/T].
# Scalar for constant rate, or one value per stress period.
# Negative = pumping, positive = injection.
# Type: UnionType[float, list, NoneType] | Optional
