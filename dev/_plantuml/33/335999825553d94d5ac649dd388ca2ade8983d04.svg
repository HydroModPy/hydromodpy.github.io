1" y="580.1138">collect end state</text><polygon fill="#A80036" points="495,610.3125,485,614.3125,495,618.3125,491,614.3125" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="489" x2="735" y1="614.3125" y2="614.3125"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="57" x="501" y="609.2466">end data</text><polygon fill="#A80036" points="56,639.4453,46,643.4453,56,647.4453,52,643.4453" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="50" x2="483" y1="643.4453" y2="643.4453"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="289" x="62" y="638.3794">AutoCaptureSnapshot (failed, with exception)</text><line style="stroke: #A80036; stroke-width: 1.0;" x1="45" x2="87" y1="694.7109" y2="694.7109"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="87" x2="87" y1="694.7109" y2="707.7109"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="46" x2="87" y1="707.7109" y2="707.7109"/><polygon fill="#A80036" points="56,703.7109,46,707.7109,56,711.7109,52,707.7109" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="120" x="52" y="674.5122">verify(state, steps)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="92" x="52" y="689.645">with the frame</text><!--MD5=[7d6c45131a3653bfe29e85f415cd124e]
@startuml
title validity_frame - capture sequence

actor Caller
participant "create_validity_frame()" as Loader
participant "AutoCaptureCollector" as Collector
participant "Probes\n(system, hardware, runtime, solver)" as Probes
participant "Run being observed" as Run

Caller -> Loader: create_validity_frame(name)
Loader - -> Caller: frame\n(entry point of validity_frame.frames)

Caller -> Collector: AutoCaptureCollector(context, probes)
Caller -> Collector: capture_start_with_time()
Collector -> Probes: collect initial state
Probes - -> Collector: start data
Collector - -> Caller: AutoCaptureSnapshot, start time

Caller -> Run: execute

alt the run succeeds
  Caller -> Collector: capture_end(start_time, ...)
  Collector -> Probes: collect end state and solver metrics
  Probes - -> Collector: end data
  Collector - -> Caller: AutoCaptureSnapshot (completed)
else the run raises
  Caller -> Collector: capture_exception(start_time, exc, ...)
  Collector -> Probes: collect end state
  Probes - -> Collector: end data
  Collector - -> Caller: AutoCaptureSnapshot (failed, with exception)
end

Caller -> Caller: verify(state, steps)\nwith the frame
@enduml

