# ----------------------------------------------------------------------
# The station and the window the scores of a run are computed on.
# ----------------------------------------------------------------------

[metrics]
# Station the run is scored at.
# Unset, it is [site] gauge; without a gauge, the only discharge station the run loads, when it loads exactly one.
# Type: Annotated (optional) | Optional | Examples: "J0014010"
# station = ""


# Dates the run is scored on, as {start, end}.
# Unset, the scores are left empty: a score over an overlap the data happen to give is not comparable.

# [metrics.window]
# First day the scores count, as an ISO 8601 date.
# Type: date | REQUIRED | Examples: "2001-01-01"
# start = ""

# Last day the scores count, included, as an ISO 8601 date.
