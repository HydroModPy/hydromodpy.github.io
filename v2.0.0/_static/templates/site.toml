# ======================================================================
# HydroModPy Configuration
# Profile: user | Modules: edition, site
# Auto-generated from Pydantic models.
# Edit values below. Comments describe each parameter.
# ======================================================================


# ----------------------------------------------------------------------
# Root-level workflow selector.
# ----------------------------------------------------------------------

# The set of defaults the file is read with.
# A key the file does not write takes its default in this edition, so a later version never moves a number of a file that did not ask.
# config.resolved.toml writes it.
# Type: string | Default: "2.0" | Examples: "2.0"
edition = "2.0"

# ----------------------------------------------------------------------
# The catchment a project models, declared once for every key that needs it.
# ----------------------------------------------------------------------

[site]
# Name of the catchment: letters, digits and underscores, case kept.
# It is the identity of the site inside the workspace, the value of the site column of the index and of every exported table.
# A real catchment (geographic.catchment.kind from_outlet_coord, from_polyg_shp or dem) is refused without it.
# The dash is reserved: it separates the site from the recipe in a case id.
# Type: string | REQUIRED | Examples: "nancon"
name = ""

# Readable name of the catchment, shown in reports, figure footers and tables.
# Free text; unset, the name is shown.
# Type: string (optional) | Optional | Examples: "Le Nançon à Lécousse"
# label = ""

# Station that measures the catchment, written once for every key that names it.
# A station source of [data.hydrometry], [data.recharge] or [data.runoff] (custom chronicles or hubeau) with no station_ids reads this station; a station_ids that leaves it out is refused by name.
# [metrics] station and a point output's observes default to it.
# Unset, a run that loads exactly one discharge station takes that station as its gauge and writes it in its manifest.
# Type: Annotated (optional) | Optional | Examples: "J0014010"
# gauge = ""

# Identifier of the catchment in a public registry, written hubeau:<station code> or bdtopage:<code>.
# It is the only key that names the same catchment in two workspaces.
# Type: string (optional) | Optional | Examples: "hubeau:J0014010"
# uri = ""

