# col_datetime = "datetime"

# Name of the column that holds the values in your chronicle CSV files.
# Type: string | Default: "value"
# col_value = "value"

# Data provider: 'file' for user CSV files, or the id of a source registered for this variable's section, such as 'sim2' for the SIM2 EDR API.
# Type: string | REQUIRED
# source = ""

# Remote URL of the one file this source reads.
# Type: string (optional) | Optional
# url = ""

# SHA256 checksum pinning the downloaded file, 64 hexadecimal digits.
# Type: string (optional) | Optional
# sha256 = ""

# Licence of the downloaded file, written to its sidecar.
# Unset means undetermined.
# Type: string (optional) | Optional
# license = ""

# Directory containing location file and chronicle CSVs, or a single .nc/.tif file.
# Type: path (optional) | Optional
# path = ""


# Substratum configuration (aquifer-bottom raster, elevation or thickness).

# Exactly one substratum data source: one bottom surface per model.
# [[data.substratum.sources]]
# Discriminator tag selecting the 'file' substratum provider.
# Type: Literal['file'] | one of: "file" | Default: "file"
# source = "file"

# Path to a user substratum raster file (GeoTIFF, ASC).
# Type: path | REQUIRED
# path = ""

# CRS to use for a raster that carries none of its own.
# Only a value written here is used: without it, a file with no CRS is refused.
# Type: string | Default: "EPSG:2154"
# default_crs = "EPSG:2154"


# Layer base configuration (one elevation raster per named layer base, read by [domain.layers] with genmtd_lay = 'surfaces').

# One raster per layer base, each under its own name.
# [[data.layer_base.sources]]
# Discriminator tag selecting the 'file' layer base provider.
# Type: Literal['file'] | one of: "file" | Default: "file"
# source = "file"

# Name a layer of [[domain.layers.layer]] gives as its surface to end on this base.
# Type: string | REQUIRED
# name = ""

# Path to a raster of the base elevation of a layer in m (GeoTIFF, ASC).
# Type: path | REQUIRED
# path = ""

# CRS to use for a raster that carries none of its own.
# Only a value written here is used: without it, a file with no CRS is refused.
# Type: string | Default: "EPSG:2154"
# default_crs = "EPSG:2154"


# Property map configuration (one raster per named map, read by a [flow.param.<id>.field] of kind 'raster', one value per pixel).

# One raster per property map, each under its own name.
# [[data.property_map.sources]]
# Discriminator tag selecting the 'file' property map provider.
# Type: Literal['file'] | one of: "file" | Default: "file"
# source = "file"

# Name a [flow.param.<id>.field] of kind 'raster' gives as its map to read this raster.
# Type: string | REQUIRED
# name = ""

# Path to a single-band raster of the property, one value per pixel (GeoTIFF, ASC), in the unit of the parameter that reads it.
# Its nodata pixels hold no value.
# Type: path | REQUIRED
# path = ""

# CRS to use for a raster that carries none of its own.
# Only a value written here is used: without it, a file with no CRS is refused.
# Type: string | Default: "EPSG:2154"
# default_crs = "EPSG:2154"


# Soil capacity configuration (RU raster read by the soil reservoir, [flow.sinks_sources.recharge.soil]).

# Exactly one soil capacity raster.
# It spreads the ru of [flow.sinks_sources.recharge.soil] over classes inside each SAFRAN cell; ru stays the mean capacity of the cells.
# [[data.soil_capacity.sources]]
# Discriminator tag selecting the 'file' soil capacity provider.
# Type: Literal['file'] | one of: "file" | Default: "file"
# source = "file"

# Path to a raster of soil available water capacity in mm (GeoTIFF, ASC).
# Read only by [flow.sinks_sources.recharge.soil].
# Type: path | REQUIRED
# path = ""

# CRS to use for a raster that carries none of its own.
# Only a value written here is used: without it, a file with no CRS is refused.
# Type: string | Default: "EPSG:2154"
# default_crs = "EPSG:2154"

