# ----------------------------------------------------------------------
# Root-level workflow selector.
# ----------------------------------------------------------------------

# The set of defaults the file is read with.
# A key the file does not write takes its default in this edition, so a later version never moves a number of a file that did not ask.
# config.resolved.toml writes it.
# Type: string | Default: "2.0" | Examples: "2.0"
edition = "2.0"

# ----------------------------------------------------------------------
# Top-level ``[data]`` configuration for the data variables.
# ----------------------------------------------------------------------

[data]
# Ordered list of data variables explicitly requested in [data].
# The launcher may append inferred types deduced from other sections (for example domain.zone_ids, a [flow.bc.stream] table).
# Allowed values: 'crossings', 'dem', 'etp', 'geology', 'humidity', 'hydrography', 'hydrometry', 'intermittency', 'lake_abacus', 'lake_bathymetry', 'lake_geometry', 'lake_inflow', 'lake_levels', 'lake_outflow', 'lake_withdrawal', 'layer_base', 'oceanic', 'piezometry', 'precipitation', 'property_map', 'radiation', 'recharge', 'runoff', 'soil_capacity', 'soil_moisture', 'substratum', 'temperature', 'water_quality', 'wind'.
# Type: list[str] | Default: []
types = []

# Policy applied when the planner infers types not explicitly listed in data.types.
# 'warn': keep inferred types and continue even if data.<type> is missing.
# 'strict': raise when an inferred type has no explicit data.<type> section (except geology, which can use its default typed config).
# Type: Literal['warn', 'strict'] | one of: "warn", "strict" | Default: "warn"
inference_mode = "warn"


# Crossings configuration (roads, railways, bridges, weirs and dams laid across the channels, read by [geographic.crossings]).

# [data.crossings]
# SHP/GPKG/GeoJSON/TIF whose bounds are the box the API sources are asked over.
# A project run has it filled in from the delineated watershed; a standalone call names it.
# Type: path (optional) | Optional
# mask_path = ""


# At least one crossings data source.
# [[data.crossings.sources]]
# Discriminator tag selecting the 'file' crossings provider.
# Type: Literal['file'] | one of: "file" | Default: "file"
# source = "file"

# Path to a vector file (SHP, GPKG, GeoJSON) or to a folder holding one.
# It must carry a 'kind' column.
# Type: path | REQUIRED
# path = ""

# Fallback CRS used only when the file carries none of its own.
# Defaults to RGF93/Lambert-93 (EPSG:2154).
# Type: string | Default: "EPSG:2154"
# default_crs = "EPSG:2154"


# DEM configuration used when 'dem' is listed in data.types.

# At least one DEM data source.
# [[data.dem.sources]]
# Vector polygon file (shp, gpkg or GeoJSON) whose extent this source is requested over.
# A project run fills it with the delineated watershed.
# Type: path (optional) | Optional
# mask_path = ""

# Download this source again instead of reading the cache.
# Type: bool | Default: false
# force_refresh = false

# Discriminator tag selecting the 'file' DEM provider.
# Type: Literal['file'] | one of: "file" | Default: "file"
# source = "file"

# Path to user DEM file or directory (TIF, ASC, NC).
# Type: path | REQUIRED | Examples: "dem.tif"
# path = ""

# Whether this DEM already drains.
# 'raw' lets the terrain chain condition it, 'conditioned' reads it as provided, so no engine conditions it and its file is the corrected DEM.
# Type: Literal['raw', 'conditioned'] | one of: "raw", "conditioned" | Default: "raw"
# state = "raw"


# Geology configuration used when 'geology' is listed in data.types.

# [data.geology]
# Identifier of the geology spatial field.
# Type: string | Default: "field_geology"
# id = "field_geology"


# At least one geology data source.
# Defaults to BRGM 1:1M.
# [[data.geology.sources]]
# Vector polygon file (shp, gpkg or GeoJSON) whose extent this source is requested over.
# A project run fills it with the delineated watershed.
# Type: path (optional) | Optional
# mask_path = ""

# Download this source again instead of reading the cache.
# Type: bool | Default: false
# force_refresh = false

# Discriminator tag selecting the BRGM 1:1M geology provider.
# Type: Literal['brgm_1m'] | one of: "brgm_1m" | Default: "brgm_1m"
# source = "brgm_1m"


# Hydrography configuration (stream network vector data).

# [data.hydrography]
# SHP/GPKG/GeoJSON/TIF whose shape the network is clipped to and whose bounds are the box the API sources are asked over.
# A project run has it filled in from the delineated watershed; a standalone call names it.
# Type: path (optional) | Optional
# mask_path = ""


# At least one hydrography data source.
# [[data.hydrography.sources]]
# Remote URL of the one file this source reads.
# Type: string (optional) | Optional
# url = ""

# SHA256 checksum pinning the downloaded file, 64 hexadecimal digits.
# Type: string (optional) | Optional
# sha256 = ""

# Licence of the downloaded file, written to its sidecar.
# Unset means undetermined.
# Type: string (optional) | Optional
# license = ""

# Data provider.
# Any source id this installation resolves and that serves river linework is accepted, so a third-party source registered on the 'hydromodpy.data.source' entry-point group is named here by its id.
# Type: string | REQUIRED | Examples: "file"
# source = ""

# Path to a vector file (SHP/GPKG/GeoJSON), raster (TIF/TIFF), or directory containing one.
# Type: path (optional) | Optional
# path = ""

# Attribute column whose values are written into the stream raster.
# A column the layer lacks, or a column of text, is replaced by a sequential number per feature.
# Type: string | Default: "FID"
# rasterize_field = "FID"

# Download this source again instead of reading the cache.
# Type: bool | Default: false
# force_refresh = false


# Hydrometry configuration (discharge time-series).

# [data.hydrometry]
# Start of the data window (ISO date, e.g.
# '2019-01-01').
# Optional: when neither bound is declared, the loader inherits [simulation.time].start_datetime, or [overview].date_start in overview mode.
# Declare it only to fetch a window WIDER than the simulation, typically a cache shared by several runs.
# Must be declared together with date_end.
# Type: string (optional) | Optional | Examples: "2019-01-01"
# date_start = ""

# End of the data window (ISO date, e.g.
# '2025-12-31').
# Optional: when neither bound is declared, the loader inherits [simulation.time].end_datetime, or [overview].date_end in overview mode.
# Declare it only to fetch a window WIDER than the simulation, typically a cache shared by several runs.
# Must be declared together with date_start.
# Type: string (optional) | Optional | Examples: "2025-12-31"
# date_end = ""


# At least one data source.
# [[data.hydrometry.sources]]
# Station identifiers to select, whether stations are read from a custom source or fetched from an API source such as Hub'Eau.
# For a station source of hydrometry, recharge or runoff, unset means [site] gauge, and a list that leaves the gauge out is refused.
# Type: list (optional) | Optional
# station_ids = []

# Download this source again instead of reading the cache.
# Type: bool | Default: false
# force_refresh = false

# Optional SHP/GPKG/GeoJSON/TIF mask to spatially filter stations or clip gridded sources.
# Type: path (optional) | Optional
# mask_path = ""

# Optional source unit for custom gridded .nc/.tif inputs.
